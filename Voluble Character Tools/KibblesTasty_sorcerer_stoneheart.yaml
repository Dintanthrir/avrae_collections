                When you activate Strength of Stone, you can confer the benefits of the
                stone aegis to another creature of your choice within 30 feet, reducing
                bludgeoning, piercing, and slashing damage taken by that creature equal to
                your proficiency bonus.


                When a creature under the effect of your protection takes damage (of any
                damage type), as a reaction you can expend one or more sorcery points to
                reduce the damage taken 1d8 per sorcery points spent. When you absorb
                damage in this way, the next time you hit a melee attack before the end of
                your next turn, you can add 1d8 per sorcery points to the damage roll.


                While empowered by your Strength of Stone, you can attack twice, instead
                of once, whenever you take the Attack action.


                Additionally, when you cast a spell using your action, you can expend 1
                sorcery point to make a single melee weapon attack as a bonus action.


                While you are empowered by Strength of Stone, you have resistance to
                bludgeoning, piercing, and slashing damage.
          _v: 2
          proper: true
          verb: gains
          activation_type: 3
