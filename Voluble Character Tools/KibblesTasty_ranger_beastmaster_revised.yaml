# 'ee71c1e0-0c4f-4cd9-9249-c1014b59b41d'
# KibblesTasty: Ranger - Beastmaster (Revised)
# https://www.kthomebrew.com/thelist
# subclass definition for Voluble Character Tools
name: Beastmaster (Revised)
parent: Ranger
counters:
  3:
    - name: Coordinated Attack
      minVal: 0
      maxVal: wisdomMod
      reset: short
      reset_to: wisdomMod
automations:
  Coordinated Attack:
    level: 3
    actions:
      - |
        - name: Coordinated Attack
          automation:
            - type: counter
              counter: Coordinated Attack
              amount: "1"
              errorBehaviour: raise
            - type: text
              text: >
                When you strike a creature with weapon attack, you can command your beast
                Companion to use its reaction to make a single attack. You can do this a
                number of times equal to your Wisdom modifier, regaining all uses when you
                complete a short or long rest.
          _v: 2
          proper: false
          verb: makes
          activation_type: 2
