  Unleashed Savagery:
    level: 6
    actions:
      - |
        name: Unleashed Savagery
        automation:
          - type: roll
            dice: 6d6[fire]
            name: damage
          - type: target
            target: all
            effects:
              - type: save
                stat: dex
                fail:
                  - type: damage
                    damage: "{damage}"
                success: []
                dc: 8 + proficiencyBonus + strengthMod
          - type: text
            text: Once during a rage, as an attack as part of the Attack action, you can
              unleash your Rage into pure energy, exhaling a blast of elemental power.
              Creatures within 15 foot cone must make a Dexterity saving throw. The DC
              of this saving throw is 8 + your proficiency modifier + your strength
              modifier. A creature takes 6d6 damage of the Elemental Type of your Dragon
              Color on a failed save.
        _v: 2
        proper: true
