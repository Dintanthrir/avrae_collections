# '6b1eaaf6-b48c-4a92-a552-93fe4bc49919'
# KibblesTasty: Barbarian - Path of the Dragon
# https://www.kthomebrew.com/thelist
# subclass definition for Voluble Character Tools
name: Path of the Dragon
parent: Barbarian
automations:
  Draconic Wrath:
    level: 3
    actions:
      - |
        name: Draconic Wrath
        automation:
          - type: counter
            counter: Rage
            amount: "1"
            errorBehaviour: raise
          - type: target
            target: self
            effects:
              - type: ieffect2
                name: Draconic Rage
                duration: "10"
                effects:
                  save_adv:
                    - str
                  check_adv:
                    - strength
                  resistances:
                    - bludgeoning
                    - piercing
                    - slashing
                    - fire
                save_as: rage
                buttons:
                  - label: End Rage
                    automation:
                      - type: remove_ieffect
                    verb: ends their rage
                    style: "2"
                attacks:
                  - attack:
                      _v: 2
                      name: Claws
                      automation:
                        - type: target
                          target: each
                          effects:
                            - type: attack
                              hit:
                                - type: damage
                                  damage: 1d4[slashing]
                              miss: []
                              attackBonus: strengthMod + proficiencyBonus
                  - attack:
                      _v: 2
                      name: Fangs
                      automation:
                        - type: target
                          target: each
                          effects:
                            - type: attack
                              hit:
                                - type: damage
                                  damage: 1d8[piercing]
                              miss: []
                              attackBonus: strengthMod + proficiencyBonus
                  - attack:
                      _v: 2
                      name: Tail
                      automation:
                        - type: target
                          target: each
                          effects:
                            - type: attack
                              hit:
                                - type: damage
                                  damage: 1d6[bludgeoning]
                              miss: []
                              attackBonus: strengthMod + proficiencyBonus
              - type: condition
                condition: choice and 'damage' in choice
                onTrue:
                  - type: ieffect2
                    name: Rage Damage
                    effects:
                      damage_bonus: 2 + {int(barbarianLevel >= 9)} + {int(barbarianLevel >= 16)}
                    parent: rage
                onFalse: []
        _v: 2
        proper: true
        verb: releases their
        activation_type: 3
        list_display_override: Enter a rage and gain draconic natural weapons. Use
          `-choice damage` to have your Rage damage apply automatically.
