# '94decc8c-8ab9-4e6a-8f08-0acbc8ac0d36'
# KibblesTasty: Psion
# https://www.kthomebrew.com/thelist
# class definition for Voluble Character Tools
hit_die: 6
sub_level: 1
features:
  psionic_disciplines: { title: 'Psionic Disciplines', type: list, level: 1 }
  psionic_talents: { title: 'Psionic Talents', type: list, level: 2 }
  innate_psionics: { title: 'Innate Psionics', type: list, level: 11 }
counters:
  1:
    - name: Psi Points
      minVal: 0
      maxVal: PsionLevel
      reset: short
      reset_to: PsionLevel
automations:
  Psionic Disciplines:
    level: 1
    actions:
      - |
        - name: Psionic Disciplines
          automation:
            - type: text
              text: >-
                You are granted access to a psionic discipline (such as Telepathy or
                Telekinesis) by your chosen archetype. A psionic discipline comes with a
                passive feature that expands your character’s capabilities and an active
                psionic power that can be modified and empowered with psi points.
                Additionally you can use your discipline in more detailed applications to
                recreate the effect of certain spells, listed at the end of the discipline
                description. At 3rd level you can select a second discipline, and 18th
                level you can select a 3rd discipline.

                Psionic powers are suppressed by antimagic fields and can be dispelled
                with dispel magic, but are only affected by counterspell if recreating the
                effect of a spell. Any check required to dispel magic, counterspell or to
                identify a spell being cast with psionics is made with disadvantage unless
                the caster also has the Psionics feature. The detect magic spell will
                detect the usage of psionics, but not their nature: it will show up as a
                mysterious untyped power, even if being used to generate the effect of a
                spell.

                When recreating a spell through a psionic effect (using a psionic
                discipline to cast the spell) the spell has no material or verbal
                components, but using any psionic ability requires somatic components and
                causes the psion to vibrantly glow with the otherworldly psionic energies
                they are controlling.
          _v: 2
          proper: true
          verb: knows
          activation_type: 2
  Psionic Mastery:
    level: 5
    actions:
      - |
        - name: Psionic Mastery
          automation:
            - type: text
              text: >-
                When you reach 5th level, you gain mastery of your psionic powers. At the
                start of your turn you get 1 free psi point. This can be spent to empower
                psionic disciplines, but not to recreate spells or fuel Psionic Talents.
                If you have any unspent free psi points granted by this feature left at
                the end of your turn, then they are lost.

                At 11th level, this is increased to 2 free psi points, and at 17th level,
                this is increased to 3. Points can be split between different abilities.
          _v: 2
          proper: true
          verb: has
          activation_type: 2
  Innate Psionics:
    level: 11
    actions:
      - |
        - name: Innate Psionics
          automation:
            - type: text
              text: >-
                At 11th level, you gain the ability to exert great feats of psionic power.
                Choose one 6th-level spell from the psion spell list as an innate ability.
                You can use this innate ability to cast that spell once. You must finish a
                long rest before you can do so again. At higher levels, you gain more
                innate abilities of your choice that can be used in this way: one
                7th-level spell at 13th level, one 8th-level spell at 15th level, and one
                9th-level spell at 17th level. You regain all uses of your Innate Psionics
                when you finish a long rest.

                Innate Psionics are well beyond the normal scope of your powers and are
                not restricted by what disciplines you have. Unlike psionic disciplines,
                they require any component the spell requires.
          _v: 2
          proper: true
          verb: has
  Ascension:
    level: 20
    actions:
      - |
        - name: Ascension
          automation:
            - type: counter
              counter: Psi Points
              amount: "0"
              fixedValue: true
              errorBehaviour: ignore
            - type: counter
              counter: Psi Points
              amount: -(10-lastCounterRemaining)
            - type: text
              text: >-
                Starting at 20th level, if you die you can choose to become an incorporeal
                entity on the Border Ethereal at the spot you died in the Material Plane
                at the start of your next turn. This entity has the physical ability
                scores (Strength, Dexterity, Constitution) and abilities of a ghost, but
                has your mental ability scores (Intelligence, Wisdom, Charisma) and your
                psion class abilities.

                When you take this form your current and maximum hit points becomes that
                of the ghost while you are in the form, if you have less than 10 psi
                points when you would assume this form, you have 10 psi points. While in
                this form you can’t rest to regain spent abilities. If you exhaust all Psi
                Points or the ghost is destroyed, you die as a normal creature would.
          _v: 2
          proper: true
          verb: completes their
          activation_type: 2
