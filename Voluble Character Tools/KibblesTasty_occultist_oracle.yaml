# '347a5621-486c-4427-aa41-6548c7dce9d2'
# KibblesTasty: Occultist - Tradition of the Oracle
# https://www.kthomebrew.com/thelist
# subclass definition for Voluble Character Tools
name: Tradition of the Oracle
parent: Occultist
features:
  mysteries: { title: Mysteries, type: list, level: 1 }
counters:
  3:
    - name: Fate Reading
      minVal: 0
      maxVal: proficiencyBonus
      reset: long
      reset_to: proficiencyBonus
automations:
  Fate Reading:
    level: 3
    actions:
      - |
        - name: Fate Reading
          automation:
            - type: counter
              counter: Fate Reading
              amount: "1"
              errorBehaviour: raise
            - type: target
              target: self
              effects:
                - type: ieffect2
                  name: Fate Reading
                  duration: "1"
                  effects:
                    ac_bonus: wisdomMod
            - type: text
              text: >-
                Your connection to the flow of fate gives you the ability to read from it,
                tracing outcomes and glimpsing the unknowable future. When you are hit by
                an attack, you can use your reaction to add your Wisdom modifier to your
                AC until the start of your next turn (including against the triggering
                attack). You can do this a number of times equal to your proficiency
                bonus, regaining all uses on a long rest.

                Additionally, you learn the spell _augury_ and can cast it at will without
                expending spell slot.
          _v: 2
          proper: false
          verb: performs
          activation_type: 4
  Enlightened Understanding:
    level: 6
    actions:
      - |
        - name: Enlightened Understanding
          automation:
            - type: target
              target: self
              effects:
                - type: temphp
                  amount: "{wisdomMod}"
            - type: text
              text: Whenever you activate a Revelation, you gain temporary hit points equal to
                your Wisdom modifier. Additionally, you can trigger a Revelation when you
                cast a 1st level spell that otherwise doesn't fit its requirements (for
                example, triggering Revelation of Fire on a spell that doesn't deal fire
                damage).
          _v: 2
          proper: true
          verb: has an
          activation_type: 2
  Master of Prophecy:
    level: 14
    actions:
      - |
        - name: "Master of Prophecy "
          automation:
            - type: text
              text: >-
                You can cast augury a number of times equal to your Wisdom modifier per
                day before it starts having a chance to return random answers.

                Additionally, when you divine the future with augury, you can issue a
                cryptic prophecy, with three specific points for rolls that may occur
                within the next 30 minutes. For each specific point you prophesize, if you
                specify only the type of roll (for example, an attack, a Strength
                (Athletics) check, or an initiative roll, etc), a d4 is reserved (example
                "someone will be particularly quick when rolling initiative").

                If you specify a specific action and a specific person, a d6 is reserved
                (for example, "when the wizard Caius rolls for initiative, he will be
                unusually quick"). If you give it a specific unlikely condition, a d8 can
                be reserved at the discretion of the GM.

                A specific action or person can only have one prophesied event. If that
                prophesied event takes place (at the discretion of the GM it has
                occurred), the oracle can spend the reserved die and add it to the roll;
                if multiple events trigger the prophecy, the oracle can select which of
                them is affected by the reserved die.
          _v: 2
          proper: false
          verb: is
          activation_type: 2
