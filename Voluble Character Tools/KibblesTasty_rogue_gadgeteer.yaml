# '9b58b592-8541-420e-9f78-b7ce876835e8'
# KibblesTasty: Rogue - Gadgeteer
# https://www.kthomebrew.com/thelist
# subclass definition for Voluble Character Tools
name: Gadgeteer
parent: Rogue
features:
  clever_inventions: { title: "Clever Inventions", type: list, level: 9 }
counters:
  17:
    - name: Ultimate Improvisation
      minVal: 0
      maxVal: intelligenceMod
      reset: long
      reset_to: intelligenceMod
automations:
  Grappling Hook:
    level: 3
    actions:
      - |
        - name: Grappling Hook
          automation:
            - type: target
              target: 1
              effects:
                - type: check
                  ability:
                    - acrobatics
                    - athletics
                  contestAbility:
                    - athletics
                  success: []
                  fail:
                    - type: ieffect2
                      name: Grappled
                      desc: Grappled by {{caster.name}}
                      buttons:
                        - label: Escape Grapple
                          verb: attempts to break out of the grapple
                          style: "3"
                          automation:
                            - type: target
                              target: children
                              effects:
                                - type: check
                                  ability:
                                    - athletics
                                  contestAbility:
                                    - acrobatics
                                    - athletics
                                  success: []
                                  fail:
                                    - type: remove_ieffect
                                  contestTie: fail
                      save_as: grapple
                  contestTie: neither
            - type: condition
              condition: not lastCheckDidPass
              onTrue:
                - type: target
                  target: self
                  effects:
                    - type: ieffect2
                      name: Grappling
                      desc: Grappling {{targets[0].name if str(targets[0])!=targets[0] else
                        targets[0]}}
                      buttons:
                        - label: Release Grapple
                          verb: lets go of their target
                          style: "1"
                          automation:
                            - type: remove_ieffect
                              removeParent: always
                      parent: grapple
              onFalse: []
              errorBehaviour: "false"
            - type: text
              text: >-
                As an action or with the bonus action granted by your Cunning Action, you
                may target a surface, object or creature within 20 feet. If the target is
                Small or Smaller, you can make a Strength (Athletics) grappling check to
                pull it to you and grapple it (automatically succeeding against objects
                that are not being worn or carried unless the DM sets a difficulty for a
                particularly complicated scenario).


                Alternatively, if the target is Medium or larger, you can choose to be
                pulled to it. This automatically succeeds, but this does not grapple it,
                though if it is a surface or large object, you can choose to hold onto at
                the point you grappled if there is something to grab onto. Attacks of
                opportunity generated by this movement have disadvantage.
          _v: 2
          proper: false
          activation_type: 3
  Pyrotechnic Gadgets:
    level: 3
    actions:
      - |
        - name: Smoke Bomb
          automation:
            - type: text
              text: As an action, you can use this to cast _fog cloud_ centered on yourself
                without expending a spell slot. It lasts a number of rounds equal to
                your Intelligence modifier and does not require concentration. When you
                cast _fog cloud_ In this way, you can set the radius at 5, 10, 15, or 20
                feet.
          _v: 2
          proper: false
          activation_type: 1
        - name: Explosive Surprise
          automation:
            - type: target
              target: all
              effects:
                - type: save
                  stat: dex
                  fail:
                    - type: damage
                      damage: "{ceil(caster.levels.get('Rogue')/2)}d6 [thunder]"
                  success: []
                  dc: 8 + intelligenceMod + proficiencyBonus
            - type: text
              text: As an action you can toss explosives at a point within 30 feet. Creatures
                within 5 feet of the target point must make a Dexterity saving throw
                against your Gadget DC or take damage equal to your Sneak Attack damage.
                If you are hidden from a creature, it makes the Dexterity saving throw
                with disadvantage. This counts as dealing Sneak Attack damage.
          _v: 2
          proper: false
          activation_type: 1
        - name: Shaped Charge
          automation:
            - type: roll
              dice: "{ceil(caster.levels.get('Rogue')/2)}d6 [thunder]"
              name: sneak_attack
              displayName: Damage
            - type: text
              text: As an action, you can place a charge on an object, building or surface
                within 5 feet. At the start of your next turn, the charge detonates,
                dealing damage equal to your sneak attack to the object, building or
                surface it was placed on, and half as much damage to any creature within
                5 feet of it.
          _v: 2
          proper: false
          verb: detonates
          activation_type: 1
  Clever Inventions:
    level: 9
    actions:
      - |
        - name: Gliding Cloak
          automation:
            - type: text
              text: You make a cloak that allows you to glide when falling. When you fall more
                than 10 feet and aren't incapacitated, can spread this cloak to reduce
                your falling speed to 30 feet a round and take no falling damage. While
                falling in this manner toward the ground under normal gravity, you can
                move horizontally 2 feet for every 1 foot you descend.
          _v: 2
          proper: false
          verb: deploys
          activation_type: 2
        - name: Mechanical Arm
          automation:
            - type: text
              text: You create a mechanical arm, giving you an extra hand. This mechanical arm
                only functions while it is mounted on gear you are wearing, but can be
                operated mentally without the need for your hands. This mechanical arm
                can serve any function a normal hand could, such as holding things,
                making attacks, interacting with the environment, etc, but does not give
                you any additional actions.
          _v: 2
          proper: false
          verb: uses
          activation_type: 2
        - name: Mechanical Familiar
          automation:
            - type: text
              text: You can create the blueprint for a small mechanical creature. At the end
                of a long rest, you can choose to create a mechanical familiar based on
                it, and cast find familiar spell without expending a spell slot. The
                familiar's type is Construct. This construct stays active until you
                deactivate it or it is destroyed. In either case, you can choose to
                reactivate it at the end of a long rest.
          _v: 2
          proper: false
          verb: designs
          activation_type: 2
        - name: Sight Lenses
          automation:
            - type: text
              text: You create a set of lenses you can integrate into a set of goggles,
                glasses, or other vision assistance that allow you to see through
                darkness and obscurement. You can see through fog, mist, smoke, clouds,
                and non-magical darkness as normal sight up to 15 feet.
          _v: 2
          proper: true
          verb: dons
          activation_type: 2
  Among the Blasts:
    level: 9
    actions:
      - |
        - name: Among the Blasts
          automation:
            - type: text
              text: When you successfully avoid damage from an area of effect with your
                Evasion feature (including from your own effects), you can use your
                reaction up to your movement speed to the edge of the effect. This
                movement does not provoke attacks of opportunity.
          _v: 2
          proper: true
          verb: moves
          activation_type: 4
  Ultimate Improvisation:
    level: 17
    actions:
      - |
        - name: Ultimate Improvisation
          automation:
            - type: counter
              counter: Ultimate Improvisation
              amount: "1"
              errorBehaviour: raise
            - type: text
              text: >-
                You can solve a wide array of problems with your Gadgets at a moment's
                notice. Over the course of 1 minute you can construct a gadget capable of
                casting any spell of 4th level or lower on the Wizard or Inventor list.
                This gadget lasts until used, or you construct another gadget (dissembling
                it in the process).


                You can do this a number of times equal to your Intelligence modifier
                before you must complete a long rest to create additional improvised
                gadgets with the feature.
          _v: 2
          proper: false
          verb: completes
          activation_type: 6
