# '5cd05323-ec5a-41af-81af-0139331e729c'
# KibblesTasty: Spellblade
# https://www.kthomebrew.com/thelist
# class definition for Voluble Character Tools
hit_die: 8
sub_level: 3
features:
  aegis: { title: 'Aegis', type: list, level: 2 }
counters:
  1:
    - name: Arcane Surge
      minVal: 0
      maxVal: proficiencyBonus
      reset: short
      reset_to: proficiencyBonus
  2:
    - name: Arcane Deflection
      minVal: 0
      maxVal: 1
      reset: short
      reset_to: 1
  6:
    - name: Arcane Recuperation
      minVal: 0
      maxVal: 1
      reset: long
      reset_to: 1
automations:
  Arcane Surge:
    level: 1
    actions:
      - |
        - name: "Arcane Surge: Detect Magic"
          automation:
            - type: counter
              counter: Arcane Surge
              amount: "1"
              errorBehaviour: raise
            - type: spell
              id: 2065
            - type: text
              text: >-
                Your affinity for magic gives you a pool of Arcane Surges. Once during
                your turn, you can expend a use of Arcane Surge to do any of the
                following:


                - **Detect Magic.** Cast detect magic without expending a spell slot.


                You can use this feature a number of times equal to your proficiency
                bonus. You can regain expended uses when you complete a short or long
                rest. As you level, you may gain additional uses for your Arcane Surges,
                but can only expend one use per turn.
          _v: 2
          proper: true
          verb: uses
        - name: "Arcane Surge: Advantage"
          automation:
            - type: counter
              counter: Arcane Surge
              amount: "1"
              errorBehaviour: raise
            - type: text
              text: >-
                Your affinity for magic gives you a pool of Arcane Surges. Once during
                your turn, you can expend a use of Arcane Surge to do any of the
                following:


                - **Advantage.** Gain advantage on an attack roll (no action required).


                You can use this feature a number of times equal to your proficiency
                bonus. You can regain expended uses when you complete a short or long
                rest. As you level, you may gain additional uses for your Arcane Surges,
                but can only expend one use per turn.
          _v: 2
          proper: true
          verb: uses
        - name: "Arcane Surge: Enhance Ability"
          automation:
            - type: counter
              counter: Arcane Surge
              amount: "1"
              errorBehaviour: raise
            - type: text
              text: >-
                Your affinity for magic gives you a pool of Arcane Surges. Once during
                your turn, you can expend a use of Arcane Surge to do any of the
                following:


                - **Enhance Ability.** Add your Intelligence modifier to a Strength or
                Dexterity ability check (no action required).


                You can use this feature a number of times equal to your proficiency
                bonus. You can regain expended uses when you complete a short or long
                rest. As you level, you may gain additional uses for your Arcane Surges,
                but can only expend one use per turn.
          _v: 2
          proper: true
          verb: uses
        - name: "Arcane Surge: Teleport"
          automation:
            - type: counter
              counter: Arcane Surge
              amount: "1"
              errorBehaviour: raise
            - type: text
              text: >-
                Your affinity for magic gives you a pool of Arcane Surges. Once during
                your turn, you can expend a use of Arcane Surge to do any of the
                following:


                - **Teleport.** Teleport up to 5 feet to an unoccupied space you can see
                (no action required). This distance increases by 5 feet at 5th (10 feet),
                9th (15 feet), 13th (20 feet), and 17th (25 feet) levels.


                You can use this feature a number of times equal to your proficiency
                bonus. You can regain expended uses when you complete a short or long
                rest. As you level, you may gain additional uses for your Arcane Surges,
                but can only expend one use per turn.
          _v: 2
          proper: true
          verb: uses
  Spellstrike:
    level: 2
    actions:
      - |
        - name: Spellstrike
          automation:
            - type: text
              text: >-
                You can infuse spells into your weapon. As a bonus action, you can cast a
                1st level or higher Spellblade spell with a casting time of 1 action in a
                special way, infusing it into a melee weapon instead of having it
                immediately take effect. The next time you make a melee attack with that
                weapon before the end of your turn, the spell is cast against the target
                of the attack. The spell fizzles and fails to cast if you cast another
                spell before attacking. Spellstrike’s interaction with the spell mechanics
                is determined by the spell’s effect:


                **Attack Rolls.** If the spell requires an attack roll (melee or ranged)
                it automatically hits the target if the weapon attack hits and misses the
                target if the weapon attack misses.

                **Saving Throws.** If the spell has a saving throw, it automatically deals
                damage as if the target failed its saving throw against the spell on hit,
                but if it has any effects besides dealing damage, the target makes the
                save against those effects as normal for being targeted by the spell
                (regardless if the attack hits or misses). If a spell does half damage to
                targets that pass their save, they take half damage on a missed attack,
                treating it as if they had passed their saving throw. If a spell always
                hits (such as magic missile), the spell hits regardless if you hit or miss
                your attack.

                **Area of Effect.** If the spell has an area of effect, that area of
                effect must include the space the target of the Spellstrike is in, be
                placed such that one edge of it is within the range of your weapon, and
                otherwise follows the rules of the spell regarding placement and range.
                Other creatures caught in the area of effect treat the spell as if you had
                cast it normally. The target is not affected by the spell again (having
                already resolved as part of the attack).

                **Multiple Attack Rolls.** Spells that have multiple attack rolls (such as
                scorching ray or crackleK) tie the outcome of only the first attack roll
                to the melee weapon attack. You resolve all subsequent attack rolls of the
                spell as if you had cast the spell, but can ignore the disadvantage on
                ranged attack rolls from being within 5 feet of hostile creatures when
                doing so.


                You can only cast spells that are on the Spellblade class list using
                Spellstrike, and can only cast them at a level you can cast them as a
                Spellblade, though you can use any spell slot you have available to cast
                the spell.
          _v: 2
          proper: false
          verb: prepares
          activation_type: 3
  Arcane Deflection:
    level: 2
    actions:
      - |
        - name: Arcane Deflection
          automation:
            - type: counter
              counter: Arcane Deflection
              amount: "1"
              errorBehaviour: raise
            - type: spell
              id: 2247
            - type: text
              text: You learn the shield spell, incorporating it into your Aegis. It doesn't
                count against your number of spells known, and you can cast it without
                expending a spell slot once, after which you must expend a spell slot as
                normal until you complete a short or long rest.
          _v: 2
          proper: true
          verb: uses
          activation_type: 4
  Aegis:
    level: 2
    actions:
      - |
        - name: Aegis
          automation:
            - type: text
              text: >-
                You start to form a magical Aegis that enhances your physical powers with
                magical powers, blending them together. You can select one 1st level slot
                Aegis effect (listed at the end of the class) and gain the effects.

                When you complete a long rest, you can change your selected 1st level slot
                Aegis effect or further boost your Aegis by sacrificing spell slots,
                granting magical empowerments that last until you complete your next long
                rest. When you do so, select an additional Aegis Effect (listed at the end
                of the class document) and expend the listed level of spell slot.

                You can expend a maximum number of spell slot levels this way equal to
                your Spellblade level divided by four (rounded up, for example, at 5th
                level you can expend two levels of spell slots this way, while at 9th
                level you can expend three levels of spell slot, etc.).
          _v: 2
          proper: false
          verb: forms
          activation_type: 2
  Arcane Recuperation:
    level: 6
    actions:
      - |
        - name: Arcane Recuperation
          automation:
            - type: counter
              counter: Arcane Recuperation
              amount: "1"
              errorBehaviour: raise
            - type: text
              text: >-
                You gain the ability to regain some of your magical energy through a quick
                focused meditation. When you finish a short rest, you regain some of your
                expended spell slots. The spell slots can have a combined level that is
                equal to or less than one third of your Spellblade level (rounded down).
                You can’t use this feature again until you finish a long rest.

                Additionally, at any time, as a bonus action you can expend a spell slot
                to regain Arcane Surges equal to the level of spell slots spent.
          _v: 2
          proper: true
          verb: uses
          activation_type: 8
  Magical Warding:
    level: 6
    actions:
      - |
        - name: Magical Warding
          automation:
            - type: text
              text: You automatically succeed on saving throws against your own spells.
          _v: 2
          proper: true
          verb: has
          activation_type: 2
  Archetypal Magic:
    level: 10
    actions:
      - |
        - name: Magical Warding
          automation:
            - type: text
              text: you can cast each of the spells granted
                by your Spellblade technique without expending a
                spell slot once. After you cast a spell that way, you
                cannot cast it that way again until you complete a
                long rest.
          _v: 2
          proper: true
          verb: knows
          activation_type: 2
  Splash Damage:
    level: 11
    actions:
      - |
        - name: Splash Damage
          automation:
            - type: text
              text: >-
                When you hit a creature with Spellstrike, the target and creatures of your
                choice within 5 feet of the target that would be hit by the same attack
                roll take 1d8 additional force damage.

                On a miss, the target takes half as much damage, and nearby creatures take
                no damage (even if the attack roll would have hit them).
          _v: 2
          proper: true
          verb: deals
          activation_type: 2
  Blast Zone Immunity:
    level: 11
    actions:
      - |
        - name: Blast Zone Immunity
          automation:
            - type: text
              text: You are immune to the area of effect of your own spells. You take no
                damage from them, and ignore all other affects unless you choose to be
                affected.
          _v: 2
          proper: true
          verb: has
          activation_type: 2
  Surging Focus:
    level: 14
    actions:
      - |
        - name: Surging Focus
          automation:
            - type: counter
              counter: Arcane Surge
              amount: "1"
              errorBehaviour: raise
            - type: text
              text: If you fail a Constitution saving throw to maintain concentration on a
                spell, you can spend an Arcane Surge to succeed instead.
          _v: 2
          proper: false
          verb: has
          activation_type: 2
  Magical Sensitivity:
    level: 14
    actions:
      - |
        - name: Magical Sensitivity
          automation:
            - type: text
              text: >-
                You learn the detect magic spell, and it does not count against your
                spells known, and the detect magic spell no longer requires concentration
                for you.

                For the duration of detect magic, you gain proficiency in the Arcana
                skill. If you are already proficient in the Arcana skill, for the duration
                you gain expertise, allowing you to add double your proficiency bonus to
                ability checks made using the Arcana skill.
          _v: 2
          proper: true
          verb: has
          activation_type: 2
  Blast Zone Control:
    level: 18
    actions:
      - |
        - name: Blast Zone Control
          automation:
            - type: counter
              counter: Arcane Surge
              amount: "1"
              errorBehaviour: raise
            - type: text
              text: When use Spellstrike to cast a spell that affects an area of effect, you
                can expend a use of your Arcane Surge expand the effect of your Blast Zone
                Immunity to a number of allies equal to your Intelligence modifier. When
                used this way, it only protects your allies until the start of your next
                turn, at which point they go back to being affected by any ongoing effects
                of a spell.
          _v: 2
          proper: true
          verb: has
          activation_type: 2
