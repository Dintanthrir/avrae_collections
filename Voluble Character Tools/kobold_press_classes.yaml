                            effects:
                              attack_advantage: "-1"
                              save_dis:
                                - all
                            buttons:
                              - label: Resist Skein Weaver
                                automation:
                                  - type: target
                                    target: self
                                    effects:
                                      - type: save
                                        stat: cha
                                        fail: []
                                        success:
                                          - type: remove_ieffect
                                          - type: ieffect2
                                            name: Stable Weave
                                            duration: "14400"
                                            desc: Immune to the Skein Weaver feature.
                                style: "3"
                                defaultDC: 8 + wisdomMod + proficiencyBonus
                        success: []
                        dc: 8 + wisdomMod + proficiencyBonus
                  - type: text
                    text: As a Bonus Action, you present your holy symbol and expend a use of your
                      Channel Divinity to alter the weaves of Fate around you. Allies within 30
                      feet of you have Advantage on attack rolls and saving throws until the end
                      of your next turn.
                  - type: text
                    text: When you use your Plucking at Threads feature, enemies within 30 feet of
