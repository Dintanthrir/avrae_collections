    Nornbound:
      parent: Cleric
      automations:
        Tailor the Skein:
          level: 3
          actions:
            - |
              - name: Tailor the Skein
                automation:
                  - type: roll
                    dice: 2d{6+2*(int(caster.levels.get("Cleric") >= 7) +
                      int(caster.levels.get("Cleric") >= 11) + int(caster.levels.get("Cleric")
                      >= 15))}
                    name: skeins
                    displayName: Skeins
                  - type: text
                    text: >-
                      You can see the threads of the celestial skein and manipulate them in
                      service to your faith. Whenever you finish a Long Rest, roll a d6 twice
                      and record the numbers rolled. These numbers are known as Skeins. As a
                      Reaction, after learning the result of an attack, damage roll, saving
                      throw, or ability check made by a creature you can see within 60 feet, you
                      may add or subtract one of your Skeins from the result. This can cause the
                      roll to succeed or fail when it otherwise wouldn't have. If you add or
                      subtract a Skein from a damage roll, it could cause a creature to live or
                      die when it otherwise wouldn't have.


                      Your die increases at higher level. At 7th level it, becomes a d8; at 11th
                      level, it becomes a d10; and at 15th level it becomes a d12.


                      Each Skein can be used only once. When you finish a Long Rest, you regain
                      all Skeins.
                _v: 2
                proper: true
                verb: can
                activation_type: 8
        Plucking at Threads:
          level: 3
          actions:
            - |
              - name: Plucking at Threads
                automation:
                  - type: counter
                    counter: Channel Divinity
                    amount: "1"
                    errorBehaviour: raise
                  - type: target
                    target: self
                    effects:
                      - type: ieffect2
                        name: Altered Fate
                        duration: "2"
                        end: true
                        desc: Allies within 30 feet of you have Advantage on attack rolls and saving
                          throws.
                  - type: text
                    text: As a Bonus Action, you present your holy symbol and expend a use of your
                      Channel Divinity to alter the weaves of Fate around you. Allies within 30
                      feet of you have Advantage on attack rolls and saving throws until the end
                      of your next turn.
                _v: 2
                proper: true
                verb: is
                activation_type: 3
        Intertwined Fate:
          level: 6
          actions:
            - |
              - name: Intertwined Fate
                automation:
                  - type: counter
                    counter:
                      slot: 1
                    amount: "1"
                    errorBehaviour: raise
                    fixedValue: true
                  - type: roll
                    dice: "{lastCounterName}d8[force]"
                    name: damage
                  - type: target
                    target: 1
                    effects:
                      - type: save
                        stat: con
                        fail:
                          - type: damage
                            damage: "{damage}"
                        success:
                          - type: damage
                            damage: ({damage})/2
                        dc: 8 + wisdomMod + proficiencyBonus
                  - type: target
                    target: 2
                    effects:
                      - type: condition
                        condition: lastSaveDidPass
                        onTrue:
                          - type: variable
                            name: restore
                            value: (damage)/2
                        onFalse:
                          - type: variable
                            name: restore
                            value: damage
                      - type: variable
                        name: healing
                        value: min(target.max_hp - target.hp, restore)
                      - type: damage
                        damage: -{healing}[healing]
                      - type: temphp
                        amount: "{restore - healing}"
                  - type: text
                    text: >-
                      As a Magic action, you expend a spell slot, twisting and altering the life
                      threads of two creatures you can see within 30 feet of you, choosing one
                      to be the primary and the other the secondary. The primary target must
                      make a Constitution saving throw, taking 1d8 Force damage per spell slot
                      level on a failure or half as much on a success. The creature may choose
                      to fail this saving throw. The secondary target then receives Hit Points
                      equal to the damage the first target took, either regaining lost Hit
                      Points, if injured, or gaining Temporary Hit Points if uninjured.


                      Use `-l` to specify spell slot level to expend. Use `fail` to force a
                      failed saving throw. I.e.

                      ```

                      !a Intertwined -t donor -t recipient -l 3 fail

                      ```
                _v: 2
                proper: false
                activation_type: 1
        Skein Weaver:
          level: 17
