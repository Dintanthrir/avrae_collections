# kobold_press_classes = 'a0370bb4-221d-4806-ba2b-9234ce725325'
# Kobold Press books' class and subclass definitions for Voluble Character Tools

2014:
  subclasses:
    # Book of Ebon Tides
    Shadow Gnawer: { parent: Barbarian }
    College of Shadows: { parent: Bard }
    Keeper Domain: { parent: Cleric }
    Shadow Domain: { parent: Cleric }
    Circle of Shadows: { parent: Druid }
    Way of the Prophet: { parent: Monk }
    Umbral Binder: { parent: Rogue }
    Light Weaver:
          parent: Sorcerer
          features:
            flickering_aura: { title: Flickering Aura, type: string, level: 1 }
    Mother of Sorrows: { parent: Warlock }
    Shadow Arcane Tradition: { parent: Wizard }

2024:
  subclasses:
    # Northlands Worldbook
    Path of the Titan:
      parent: Barbarian
      automations:
        Rage of the Giants:
          level: 3
          actions:
            - |
              - name: Rage of the Giants
                automation:
                  - type: text
                    text: >-
                      Your Rage taps into the primal power of giants. Whenever you activate your
                      Rage, if you are smaller than Large, you can choose to become Large. Your
                      equipment grows to match your new size. If there is not enough room for
                      you to become Large, you do not grow.


                      While you are Large, your carrying capacity doubles, you have Advantage on
                      Strength checks and Strength saving throws, and your attacks with weapons
                      or Unarmed Strikes deal one additional die of damage (a Greatsword attack
                      deals 3d6 damage, a Greataxe deals 2d12, and so on).


                      Use `-d <weapon die>` to add additional damage to weapon attacks e.g. `!a
                      "Greataxe" -d 1d12 -t ...`
                _v: 2
                proper: true
                verb: has
                activation_type: 2
        Crushing Steps:
          level: 6
          actions:
            - |
              - name: Crushing Steps
                automation:
                  - type: target
                    target: all
                    effects:
                      - type: save
                        stat: str
                        fail:
                          - type: ieffect2
                            name: Prone
                            effects:
                              attack_advantage: "-1"
                            desc: A prone creature's only movement option is to crawl, unless it stands up
                              and thereby ends the condition
                            buttons:
                              - label: Stand Up
                                verb: stands up
                                automation:
                                  - type: remove_ieffect
                          - type: ieffect2
                            name: No reactions
                            duration: "1"
                        success: []
                        dc: 8 + strengthMod + proficiencyBonus
                  - type: text
                    text: As part of your movement, you can move through the space of any creature
                      with a size smaller than you. An enemy whose space you move through must
                      succeed on a Strength saving throw (DC 8 plus your Strength modifier and
                      Proficiency Bonus) or have the Prone condition and lose the ability to
                      take Reactions until the start of its next turn.
                _v: 2
                proper: true
                activation_type: 2
        Titanic Strikes:
          level: 10
          actions:
            - |
              - name: Titanic Strikes
                automation:
                  - type: text
                    text: When you use your Brutal Strike feature, the distance the target is pushed
                      by your Forceful Blow is doubled, and the Speed of a target struck by your
                      Hamstring Blow is reduced to 0 until the start of your next turn.
                _v: 2
                proper: true
                activation_type: 2
        Rage of the Titans:
          level: 14
          actions:
            - |
              - name: Rage of the Titans
                automation:
                  - type: text
                    text: >-
                      Whenever you activate your Rage, if you are smaller than Huge, you can
                      choose to become Huge. Your equipment grows to match your new size. If
                      there is not enough room for you to become Huge, you become Large. If
                      there is not enough room for you to become Large, you do not grow.


                      While you are Huge, your carrying capacity triples, your reach increases
                      by 5 feet, you have Advantage on Strength checks and Strength saving
                      throws, and your attacks with weapons or Unarmed Strikes deal two
                      additional dice of damage (a Greatsword attack deals 4d6 damage, a
                      Greataxe deals 3d12, and so on).


                      Use `-d <weapon die>` to add additional damage to weapon attacks e.g. `!a
                      "Greataxe" -d 2d12 -t ...`
                _v: 2
                proper: true
                activation_type: 2
    Skald:
      parent: Bard
      counters:
        14:
          - name: Battle Sagas
            minVal: 0
            maxVal: 1
            reset: short
      automations:
        Poetic Provocation:
          level: 3
          actions:
            - |
              - name: Poetic Provocation
                automation:
                  - type: text
                    text: >-
                      Thanks to your way with words, you gain the following benefits.


                      **Vicious Cantrip.** You always have the Vicious Mockery cantrip prepared.
                      If you already know the Vicious Mockery cantrip, you learn a new cantrip
                      of your choice. A creature that fails its saving throw against your
                      Vicious Mockery has Disadvantage on the next Wisdom, Intelligence, or
                      Charisma saving throw that it makes before the end of your next turn, in
                      addition to the spell's normal effects.


                      **Flyting Master.** You can use Charisma (Performance) in place of
                      Charisma (Intimidation) or Charisma (Persuasion) checks to antagonize a
                      creature into a fight, threaten a creature to avoid a confrontation, rile
                      or soothe the attitude of a mob, or any other situation where your skill
                      in weaving a story or applying a cutting insult would sway an opinion.
                _v: 2
                proper: false
                verb: speaks
                activation_type: 2
              - name: Martial Training
                automation:
                  - type: text
                    text: >-
                      You gain proficiency with Martial weapons and training with Medium armor
                      and Shields. In addition, you can use a Simple or Martial weapon as a
                      Spellcasting Focus to cast spells from the Bard spell list.


                      In addition, your training with weapons allows you to use the mastery
                      properties of one Simple or Martial weapon of your choice. Whenever you
                      finish a Long Rest, you can practice weapon drills and change your weapon
                      choice.
                _v: 2
                proper: true
                verb: has
                activation_type: 2
