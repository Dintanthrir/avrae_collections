                _v: 2
                proper: true
                activation_type: 3
              - name: "Bragi's Rune of Speech: Vitality"
                automation:
                  - type: counter
                    counter: Bardic Inspiration
                    amount: "1"
                    errorBehaviour: raise
                  - type: roll
                    dice: 1d{6 + 2*(caster.levels.get("Bard")//5}
