  Focused Transformation:
    level: 14
    actions:
      - |
        - name: Focused Transformation
          automation:
            - type: text
              text: While you are concentrating on an innate spell granted by this subclass,
                your concentration can’t be broken as a result of taking damage.
          _v: 2
          proper: false
          verb: experiences
          activation_type: 2
  Gigantification:
    level: 17
    actions:
      - |
        - name: Gigantification
          automation:
            - type: counter
              counter: Gigantification
              amount: "1"
              errorBehaviour: raise
            - type: target
              target: self
              effects:
                - type: ieffect2
                  name: Gigantification
                  duration: "10"
                  effects:
                    save_adv:
                      - str
                      - con
                  attacks:
                    - attack:
                        _v: 2
                        name: Throwing Things
                        automation:
                          - type: roll
                            dice: 4d6+{strengthMod}[bludgeoning]
                            name: damage
                          - type: target
                            target: 1
                            effects:
                              - type: attack
                                hit:
                                  - type: damage
                                    damage: "{damage}"
                                miss: []
                                attackBonus: strengthMod + proficiencyBonus
                          - type: target
                            target: 2
                            effects:
                              - type: damage
                                damage: "{damage}"
            - type: text
              text: >-
                As a bonus action or when you manifest your bestial claws, you can unleash
                the bestial power within, swelling to massive size. You become Large or
                Huge (your choice) for 1 minute. Upon transforming, you gain temporary hit
                points equal to half of your maximum hit points. For the duration of your
                transformation, you gain the following benefits:


                - **Bonus Damage.** Your natural weapons deal an additional die of damage.
                Add with `-d <die>`.

                - **Grappling Advantage.** You have advantage on all checks to grapple
                creatures smaller than you.

                - **Reach.** Your reach increases by 5 feet with all weapons.

                - **Faster Movement.** Your movement speed increases by 20 feet.

                - **Jumping Distance.** The distance you can long or high jump with a
                running start is doubled.

                - **Saving Throws.** You have advantage on Strength and Constitution
                saving throws.

                - **Throwing Things.** While in this form, when you make an attack, you
                can throw Medium or Small objects or creatures you are holding with a
                range of 50/100 feet. You have proficiency with this attack, regardless of
                what you are throwing. On hit, both the target and the thrown creature or
                object takes 4d6 + your Strength modifier damage. On miss, only the thrown
                creature or object takes the damage (this damage is taken in place of any
                falling damage, unless they also fall vertical distance as part of this
                movement, such as being thrown off a wall or cliff).


                Once you use this feature, you cannot use it again until you complete a
                long rest.
          _v: 2
          proper: true
          verb: experiences
          activation_type: 3
          list_display_override: List targets as `-t <target creature> [-t <thrown creature/object>]`
