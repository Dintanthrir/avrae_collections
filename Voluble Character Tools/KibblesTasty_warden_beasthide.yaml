# KibblesTasty: Warden - Beasthide
# https://www.kthomebrew.com/thelist
# subclass definition for Voluble Character Tools
name: Beasthide
parent: Warden
counters:
  1:
    - name: "Innate Magic: Speak With Animals"
      minVal: 0
      maxVal: 1
      reset: long
      reset_to: 1
  3:
    - name: "Innate Magic: Animal Messenger"
      minVal: 0
      maxVal: 1
      reset: long
      reset_to: 1
  5:
    - name: "Innate Magic: Alter Self"
      minVal: 0
      maxVal: 1
      reset: long
      reset_to: 1
  9:
    - name: "Innate Magic: Enlarge/Reduce"
      minVal: 0
      maxVal: 1
      reset: long
      reset_to: 1
  13:
    - name: "Innate Magic: Mutate"
      minVal: 0
      maxVal: 1
      reset: long
      reset_to: 1
  17:
    - name: "Innate Magic: Polymorph"
      minVal: 0
      maxVal: 1
      reset: long
      reset_to: 1
    - name: Gigantification
      minVal: 0
      maxVal: 1
      reset: long
      reset_to: 1
automations:
  Bestial Claws:
    level: 1
    actions:
      - |
        - name: Grow Bestial Claws
          automation:
            - type: target
              target: self
              effects:
                - type: ieffect2
                  name: Bestial Claws
                  attacks:
                    - attack:
                        _v: 2
                        name: Bestial Claws
                        automation:
                          - type: target
                            target: all
                            effects:
                              - type: attack
                                hit:
                                  - type: damage
                                    damage: 1d{8 + 2*int(WardenLevel >= 11)} + {strengthMod}[slashing]
                                miss: []
                                attackBonus: strengthMod + proficiencyBonus
                    - attack:
                        _v: 2
                        name: Offhand Bestial Claws
                        automation:
                          - type: target
                            target: each
                            effects:
                              - type: attack
                                hit:
                                  - type: damage
                                    damage: 1d{8 + 2*int(WardenLevel >= 11)}[slashing]
                                miss: []
                                attackBonus: strengthMod + proficiencyBonus
                    - attack:
                        _v: 2
                        name: Bestial Claws - Grapple
                        automation:
                          - type: target
                            target: 1
                            effects:
                              - type: check
                                ability:
                                  - acrobatics
                                  - athletics
                                contestAbility:
                                  - athletics
                                success: []
                                fail:
                                  - type: ieffect2
                                    name: Grappled
                                    desc: Grappled by {{caster.name}}
                                    buttons:
                                      - label: Escape Grapple
                                        verb: attempts to break out of the grapple
                                        style: "3"
                                        automation:
                                          - type: target
                                            target: children
                                            effects:
                                              - type: check
                                                ability:
                                                  - athletics
                                                contestAbility:
                                                  - acrobatics
                                                  - athletics
                                                success: []
                                                fail:
                                                  - type: remove_ieffect
                                                contestTie: fail
                                    save_as: grapple
                                  - type: damage
                                    damage: 1d{6 + 2*int(WardenLevel >= 11)}[slashing]
                                contestTie: neither
                          - type: condition
                            condition: not lastCheckDidPass
                            onTrue:
                              - type: target
                                target: self
                                effects:
                                  - type: ieffect2
                                    name: Grappling
                                    desc: Grappling {{targets[0].name if str(targets[0])!=targets[0] else
                                      targets[0]}}
                                    buttons:
                                      - label: Release Grapple
                                        verb: lets go of their target
                                        style: "1"
                                        automation:
                                          - type: remove_ieffect
                                            removeParent: always
                                    parent: grapple
                            onFalse: []
                            errorBehaviour: "false"
            - type: text
              text: >-
                A vicious set of claws extending from one of your hands. This becomes a
                natural one handed melee weapon that deals 1d8 slashing damage on hit, and
                has the Light and Special properties.

                **Special:** This weapon counts as a free hand for the purposes of
                grappling. When you successfully initiate a grapple with it, the target
                takes 1d6 slashing damage.
          _v: 2
          proper: true
          verb: can
          activation_type: 3
  Ruthless Interdiction:
    level: 3
    actions:
      - |
        - name: Ruthless Interdiction
          automation:
            - type: text
              text: You have advantage on the first attack roll or grapple check you make
                against a creature that attacked anyone that was inside the range of your
                Primal Interdiction (including yourself) since the end of your last turn.
          _v: 2
          proper: false
          verb: performs
          activation_type: 2
  Enduring Ferocity:
    level: 3
    actions:
      - |
        - name: Enduring Ferocity
          automation:
            - type: text
              text: When you roll an Endurance Die, you can also add the die to the next
                damage roll or Strength (Athletics) check you make before the end of your
                next turn.
          _v: 2
          proper: true
          activation_type: 2
