# 'bacb62cc-2498-4e89-9bcd-bfd38fd6d10d'
# KibblesTasty: Monk - Way of the Demon
# https://www.kthomebrew.com/thelist
# subclass definition for Voluble Character Tools
name: Way of the Demon
parent: Monk
automations:
  Demonic Techniques:
    level: 3
    actions:
      - |
        - name: Demon Burst
          automation:
            - type: target
              target: all
              effects:
                - type: save
                  stat: dex
                  fail:
                    - type: damage
                      damage: 1d{4 + 2*int(MonkLevel >= 5) + 2*int(MonkLevel >= 11) + 2*int(MonkLevel
                        >= 17)}[necrotic]
                  success: []
            - type: text
              text: You unleash a wave of demonic energy. Each creature within 5 feet of you
                must make a Dexterity saving throw, or Necrotic damage equal to your
                Martial Arts die.
          _v: 2
          proper: false
          activation_type: 1
        - name: Demon Punch
          automation:
            - type: target
              target: each
              effects:
                - type: attack
                  hit:
                    - type: damage
                      damage: 1d{4 + 2*int(MonkLevel >= 5) + 2*int(MonkLevel >= 11) + 2*int(MonkLevel
                        >= 17)}[necrotic]
                  miss: []
                  attackBonus: dexterityMod + proficiencyBonus
            - type: text
              text: You make an unarmed strike. On hit, the damage is converted to Necrotic
                damage and the target is knocked 5 feet away from you for each die of
                damage dealt by this attack.
          _v: 2
          proper: false
          activation_type: 1
        - name: Demon Flare
          automation:
            - type: target
              target: each
              effects:
                - type: attack
                  hit:
                    - type: damage
                      damage: 1d{4 + 2*int(MonkLevel >= 5) + 2*int(MonkLevel >= 11) + 2*int(MonkLevel
                        >= 17)}[fire]
                  miss: []
                  attackBonus: dexterityMod + proficiencyBonus
            - type: text
              text: You unleash a flare of demonic fire at a creature within 30 feet, making a
                ranged weapon attack. On hit the target takes Fire damage equal to your
                unarmed strike.
          _v: 2
          activation_type: 1
          proper: false
