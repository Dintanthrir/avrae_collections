                        - type: variable
                          name: hits
                          value: hits + 1
                      miss: []
                      attackBonus: dexterityMod + proficiencyBonus
                    - type: condition
                      condition: hit >= 3
                      onTrue:
                        - type: ieffect2
                          name: Prone
                          buttons:
