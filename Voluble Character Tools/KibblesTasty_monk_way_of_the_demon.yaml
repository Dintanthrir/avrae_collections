                              automation:
                                - type: remove_ieffect
                              style: "1"
                        - type: ieffect2
                          name: Dazed
                          duration: "1"
                          desc: "Can only do one of the following: move, take its action, or take a bonus
                            action. It cannot take reactions."
                          end: true
                      onFalse: []
                    - type: condition
                      condition: caster.hp <= caster.max_hp / 2
                      onTrue:
                        - type: attack
                          hit:
                            - type: damage
                              damage: 1d{4 + 2*int(MonkLevel >= 5) + 2*int(MonkLevel >= 11) + 2*int(MonkLevel
                                >= 17)}[bludgeoning]
                          miss: []
                          attackBonus: dexterityMod + proficiencyBonus
                        - type: attack
                          hit:
                            - type: damage
                              damage: 1d{4 + 2*int(MonkLevel >= 5) + 2*int(MonkLevel >= 11) + 2*int(MonkLevel
                                >= 17)}[bludgeoning]
                          miss: []
                          attackBonus: dexterityMod + proficiencyBonus
                      onFalse: []
                  onFalse: []
