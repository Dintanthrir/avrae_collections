# subclass definition for Voluble Character Tools
name: Battlemage
parent: Spellblade
counters:
  10:
    - name: "Archetypal Magic: Burning Hands"
      minVal: 0
      maxVal: 1
      reset: long
      reset_to: 1
    - name: "Archetypal Magic: Mirror Image"
      minVal: 0
      maxVal: 1
      reset: long
      reset_to: 1
    - name: "Archetypal Magic: Lightning Bolt"
      minVal: 0
      maxVal: 1
      reset: long
      reset_to: 1
  13:
    - name: "Archetypal Magic: Dimension Door"
      minVal: 0
      maxVal: 1
      reset: long
      reset_to: 1
  17:
    - name: "Archetypal Magic: Hold Monster"
      minVal: 0
      maxVal: 1
      reset: long
      reset_to: 1
  20:
    - name: Unlimited Surges
      minVal: 0
      maxVal: 1
