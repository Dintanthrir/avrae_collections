name: Timetwister
parent: Warden
counters:
  1:
    - name: "Innate Magic: Longstrider"
      minVal: 0
      maxVal: 1
      reset: long
      reset_to: 1
  3:
    - name: "Innate Magic: Hold Person"
      minVal: 0
      maxVal: 1
      reset: long
      reset_to: 1
  5:
    - name: "Innate Magic: Alacrity"
      minVal: 0
      maxVal: 1
      reset: long
      reset_to: 1
  9:
    - name: "Innate Magic: Slow"
      minVal: 0
      maxVal: 1
      reset: long
      reset_to: 1
  13:
    - name: "Innate Magic: Haste"
      minVal: 0
      maxVal: 1
      reset: long
      reset_to: 1
  17:
    - name: "Innate Magic: Hold Monster"
      minVal: 0
      maxVal: 1
      reset: long
      reset_to: 1
    - name: Time Lock
      minVal: 0
      maxVal: 1
      reset: long
