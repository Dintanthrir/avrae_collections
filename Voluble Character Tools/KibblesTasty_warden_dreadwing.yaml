# KibblesTasty: Warden - Dreadwing
# https://www.kthomebrew.com/thelist
# subclass definition for Voluble Character Tools
name: Dreadwing
parent: Warden
counters:
  1:
    - name: "Innate Magic: Elemental Orb"
      minVal: 0
      maxVal: 1
      reset: long
      reset_to: 1
  3:
    - name: "Innate Magic: Dragon Surge"
      minVal: 0
      maxVal: 1
      reset: long
      reset_to: 1
  5:
    - name: "Innate Magic: Elemental Exhalation"
      minVal: 0
      maxVal: 1
      reset: long
      reset_to: 1
  9:
    - name: "Innate Magic: Fly"
      minVal: 0
      maxVal: 1
      reset: long
      reset_to: 1
  13:
    - name: "Innate Magic: Fear"
      minVal: 0
      maxVal: 1
      reset: long
      reset_to: 1
  17:
    - name: "Innate Magic: Secret Chest"
      minVal: 0
      maxVal: 1
      reset: long
      reset_to: 1
