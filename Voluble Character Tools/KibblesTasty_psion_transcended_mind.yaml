# '9b69f9ba-d307-474a-ba2b-8814ebf5ae98'
# KibblesTasty: Psion - Transcended Mind
# https://www.kthomebrew.com/thelist
# subclass definition for Voluble Character Tools
name: Transcended Mind
parent: Psion
automations:
  State of Mind:
    level: 1
    actions:
      - |
        - name: State of Mind
          automation:
            - type: text
              text: >-
                You can ignore the effects of extreme heat or cold, hold your breath
                twice as long as normal, and can go twice as long without eating or
                sleeping before suffering exhaustion.
          _v: 2
          proper: true
          verb: knows their
          activation_type: 2
  Balance of Power:
    level: 3
    actions:
      - |
        - name: Balance of Power
          automation:
            - type: text
              text: >-
                When you use a psionic ability (power or spell) to restore hit points
                or grant temporary hit points, you can add equivalent hit points
                granted to a stored pool. The maximum value of the pool is your psion
                level, and any points beyond the maximum are lost. The next time you
                make a damage roll, you can expend the pool to add damage equal to
                the stored value to one target affected by the damage roll. This
                stored damage is lost if not spent within 1 minute.
          _v: 2
          proper: false
          verb: has
          activation_type: 2
  Perfected Enhancement:
    level: 6
    actions:
      - |
        - name: Perfected Enhancement
          automation:
            - type: text
              text: When you grant temporary hit points with a psionic power you can
                add your proficiency bonus to the temporary hit points gained by one
                creature.
          _v: 2
          proper: true
          verb: has
          activation_type: 2
  Mental Control:
    level: 10
    actions:
      - |
        - name: Mental Control
          automation:
            - type: text
              text: When you have to make a Constitution saving throw to avoid losing
                concentration on an effect from a psionic discipline, you can add your
                Intelligence modifier to the saving throw.
          _v: 2
          proper: true
          verb: has
          activation_type: 2
  Mind Over Matter:
    level: 14
    actions:
      - |
        - name: Mind Over Matter
          automation:
            - type: text
              text: When you would roll a Strength, Dexterity, or Constitution saving
                throw, you can expend 2 psi points to roll an Intelligence saving throw
                instead. Additionally, when you roll a Death saving throw, you can
                expend 4 psi points before rolling to treat the roll as 20.
          _v: 2
          proper: true
          verb: uses
          activation_type: 2
