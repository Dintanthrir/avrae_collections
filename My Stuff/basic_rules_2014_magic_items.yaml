Gray Bag of Tricks:
  counters:
    - name: Gray Bag of Tricks
      desc: Pull a creature from the bag.
      min: 0
      max: 3
      reset: long
      reset_to: 3
      type: circle
  automations:
    - |
      - name: Gray Bag of Tricks
        automation:
          - type: counter
            counter: Gray Bag of Tricks
            amount: "1"
            errorBehaviour: raise
          - type: roll
            dice: 1d8
            name: creature
            displayName: Creature
          - type: condition
            condition: creature == 1
            onTrue:
              - type: text
                text: ""
                title: Weasel
            onFalse: []
          - type: condition
            condition: creature == 2
            onTrue:
              - type: text
                text: ""
                title: Giant Rat
            onFalse: []
          - type: condition
            condition: creature == 3
            onTrue:
              - type: text
                text: ""
                title: Badger
            onFalse: []
          - type: condition
            condition: creature == 4
            onTrue:
              - type: text
                text: ""
                title: Boar
            onFalse: []
          - type: condition
            condition: creature == 5
            onTrue:
              - type: text
                text: ""
                title: Panther
            onFalse: []
          - type: condition
            condition: creature == 6
            onTrue:
              - type: text
                text: ""
                title: Giant Badger
            onFalse: []
          - type: condition
            condition: creature == 7
            onTrue:
              - type: text
                text: ""
                title: Dire Wolf
            onFalse: []
          - type: condition
            condition: creature == 8
            onTrue:
              - type: text
                text: ""
                title: Giant Elk
            onFalse: []
          - type: text
            text: >-
              This ordinary bag, made from gray, rust, or tan cloth, appears empty.
              Reaching inside the bag, however, reveals the presence of a small, fuzzy
              object. The bag weighs 1/2 pound.


              You can use an action to pull the fuzzy object from the bag and throw it up to 20 feet. When the object lands, it transforms into a creature you determine by rolling a d8 and consulting the table that corresponds to the bag's color. See the Monsters Listing for the creature's statistics. The creature vanishes at the next dawn or when it is reduced to 0 hit points.


              The creature is friendly to you and your companions, and it acts on your turn. You can use a bonus action to command how the creature moves and what action it takes on its next turn, or to give it general orders, such as to attack your enemies. In the absence of such orders, the creature acts in a fashion appropriate to its nature.


              Once three fuzzy objects have been pulled from the bag, the bag can't be used again until the next dawn.
        _v: 2
        proper: false
        verb: pulls from
        activation_type: 1
