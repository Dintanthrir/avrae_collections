Amulet of the Planes:
  automations:
    - |
      - name: Amulet of the Planes
        automation:
          - type: target
            target: self
            effects:
              - type: check
                ability: intelligence
                dc: "15"
                success:
                  - type: text
                    text: You cast the plane shift spell.
                    title: Success!
                fail:
                  - type: roll
                    dice: 1d100
                    name: ""
                    displayName: Destination Roll
                  - type: condition
                    condition: lastRoll <= 60
                    onTrue:
                      - type: text
                        text: You and each creature and object withing 15 feet of you travel to a random
                          location on the plane you named.
                        title: Failure!
                    onFalse:
                      - type: text
                        text: You and each creature and object withing 15 feet of you travel to a
                          randomly determined plane of existence.
                        title: Failure!
          - type: spell
            id: 2206
        _v: 2
        proper: true
        verb: uses an
        activation_type: 1
        list_display_override: Attempt to plane shift.
