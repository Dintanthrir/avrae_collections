# basic_rules_2014_wands = "4845f393-c93e-42e6-a01e-307d1fd302f2"
Wand of Binding:
  counters:
    - name: Wand of Binding
      min: 0
      max: 7
      reset: long
      reset_by: 1d6+1
      type: circle
  automations:
    - |
      name: Wand of Binding (Hold Monster)
      automation:
        - type: counter
          counter: Wand of Binding
          amount: "5"
          allowOverflow: false
          fixedValue: true
          errorBehaviour: raise
        - type: spell
          id: 2146
          dc: "17"
        - type: text
          text: This wand has 7 charges for the following properties. It regains 1d6 + 1
            expended charges daily at dawn. If you expend the wand's last charge, roll
            a d20. On a 1, the wand crumbles into ashes and is destroyed.
        - type: condition
          condition: lastCounterRemaining == 0
          onTrue:
            - type: roll
              dice: 1d20
              name: destruction
            - type: condition
              condition: lastRoll == 1
              onTrue:
                - type: text
                  text: The wand crumbles into ashes and is destroyed.
                  title: Destruction!
              onFalse: []
          onFalse: []
      _v: 2
      proper: false
      verb: casts with
      activation_type: 1
    - |
      name: Wand of Binding (Hold Person)
      automation:
        - type: counter
          counter: Wand of Binding
          amount: "2"
          allowOverflow: false
          fixedValue: true
          errorBehaviour: raise
        - type: spell
          id: 2147
          dc: "17"
        - type: text
          text: This wand has 7 charges for the following properties. It regains 1d6 + 1
            expended charges daily at dawn. If you expend the wand's last charge, roll
            a d20. On a 1, the wand crumbles into ashes and is destroyed.
        - type: condition
          condition: lastCounterRemaining == 0
          onTrue:
            - type: roll
              dice: 1d20
              name: destruction
            - type: condition
              condition: lastRoll == 1
              onTrue:
                - type: text
                  text: The wand crumbles into ashes and is destroyed.
                  title: Destruction!
              onFalse: []
          onFalse: []
      _v: 2
      proper: false
      verb: casts with
      activation_type: 1
    - |
      name: Wand of Binding (Assisted Escape)
      automation:
        - type: counter
          counter: Wand of Binding
          amount: "1"
          allowOverflow: false
          fixedValue: true
          errorBehaviour: raise
        - type: text
          text: This wand has 7 charges for the following properties. It regains 1d6 + 1
            expended charges daily at dawn. If you expend the wand's last charge, roll
            a d20. On a 1, the wand crumbles into ashes and is destroyed.
        - type: text
          text: While holding the wand, you can use your reaction to expend 1 charge and
            gain advantage on a saving throw you make to avoid being paralyzed or
            restrained, or you can expend 1 charge and gain advantage on any check you
            make to escape a grapple.
          title: Assisted Escape
        - type: condition
          condition: lastCounterRemaining == 0
          onTrue:
            - type: roll
              dice: 1d20
              name: destruction
            - type: condition
              condition: lastRoll == 1
              onTrue:
                - type: text
                  text: The wand crumbles into ashes and is destroyed.
                  title: Destruction!
              onFalse: []
          onFalse: []
      _v: 2
      proper: false
      verb: casts with
      activation_type: 4
Wand of Enemy Detection:
  counters:
    - name: Wand of Enemy Detection
      min: 0
      max: 7
      reset: long
      reset_by: 1d6+1
      type: circle
  automations:
    - |
      name: Wand of Enemy Detection
      automation:
        - type: counter
          counter: Wand of Enemy Detection
          amount: "1"
          allowOverflow: false
          fixedValue: true
          errorBehaviour: raise
        - type: text
          text: >-
            This wand has 7 charges. While holding it, you can use an action and
            expend 1 charge to speak its command word. For the next minute, you know
            the direction of the nearest creature hostile to you within 60 feet, but
            not its distance from you. The wand can sense the presence of hostile
            creatures that are ethereal, invisible, disguised, or hidden, as well as
            those in plain sight. The effect ends if you stop holding the wand.


            The wand regains 1d6 + 1 expended charges daily at dawn. If you expend the wand's last charge, roll a d20. On a 1, the wand crumbles into ashes and is destroyed.
        - type: condition
          condition: lastCounterRemaining == 0
          onTrue:
            - type: roll
              dice: 1d20
              name: destruction
            - type: condition
              condition: lastRoll == 1
              onTrue:
                - type: text
                  text: The wand crumbles into ashes and is destroyed.
                  title: Destruction!
              onFalse: []
          onFalse: []
      _v: 2
      proper: false
      verb: uses
      activation_type: 1
Wand of Fear:
  counters:
    - name: Wand of Fear
      min: 0
      max: 7
      reset: long
      reset_by: 1d6+1
      type: circle
  automations:
    - |
      name: Wand of Fear (Command)
      automation:
        - type: counter
          counter: Wand of Fear
          amount: "1"
          allowOverflow: false
          fixedValue: true
          errorBehaviour: raise
        - type: text
          text: This wand has 7 charges for the following properties. It regains 1d6 + 1
            expended charges daily at dawn. If you expend the wand's last charge, roll
            a d20. On a 1, the wand crumbles into ashes and is destroyed.
          title: ""
        - type: text
          text: While holding the wand, you can use an action to expend 1 charge and
            command another creature to flee or grovel, as with the command spell
            (save DC 15).
          title: Command
        - type: spell
          id: 2032
          dc: "15"
        - type: condition
          condition: lastCounterRemaining == 0
          onTrue:
            - type: roll
              dice: 1d20
              name: destruction
            - type: condition
              condition: lastRoll == 1
              onTrue:
                - type: text
                  text: The wand crumbles into ashes and is destroyed.
                  title: Destruction!
              onFalse: []
          onFalse: []
      _v: 2
      proper: false
      verb: uses
      activation_type: 1
    - |
      name: Wand of Fear (Cone of Fear)
      automation:
        - type: counter
          counter: Wand of Fear
          amount: "2"
          allowOverflow: false
          fixedValue: true
          errorBehaviour: raise
        - type: text
          text: This wand has 7 charges for the following properties. It regains 1d6 + 1
            expended charges daily at dawn. If you expend the wand's last charge, roll
            a d20. On a 1, the wand crumbles into ashes and is destroyed.
          title: ""
        - type: text
          text: While holding the wand, you can use an action to expend 2 charges, causing
            the wand's tip to emit a 60-foot cone of amber light. Each creature in the
            cone must succeed on a DC 15 Wisdom saving throw or become frightened of
            you for 1 minute. While it is frightened in this way, a creature must
            spend its turns trying to move as far away from you as it can, and it
            can't willingly move to a space within 30 feet of you. It also can't take
            reactions. For its action, it can use only the Dash action or try to
            escape from an effect that prevents it from moving. If it has nowhere it
            can move, the creature can use the Dodge action. At the end of each of its
            turns, a creature can repeat the saving throw, ending the effect on itself
            on a success.
          title: Cone of Fear
        - type: target
          target: all
          effects:
            - type: save
              stat: wis
              fail:
                - type: ieffect2
                  name: Frightened
                  buttons:
                    - label: Resist Fear
                      automation:
                        - type: target
                          target: self
                          effects:
                            - type: save
                              stat: dex
                              success:
                                - type: remove_ieffect
                                  removeParent: if_no_children
                              fail: []
                      verb: attempts to resist fear
                      style: "1"
                      defaultDC: lastSaveDC
              success: []
              dc: "15"
        - type: condition
          condition: lastCounterRemaining == 0
          onTrue:
            - type: roll
              dice: 1d20
              name: destruction
            - type: condition
              condition: lastRoll == 1
              onTrue:
                - type: text
                  text: The wand crumbles into ashes and is destroyed.
                  title: Destruction!
              onFalse: []
          onFalse: []
      _v: 2
      proper: false
      verb: uses
      activation_type: 1
Wand of Fireballs:
  counters:
    - name: Wand of Fireballs
      min: 0
      max: 7
      reset: long
      reset_by: 1d6+1
      type: circle
  automations:
    - |
      name: Wand of Fireballs
      automation:
        - type: counter
          counter: Wand of Fireballs
          amount: "1"
          allowOverflow: false
          fixedValue: false
          errorBehaviour: raise
        - type: text
          text: >-
            This wand has 7 charges. While holding it, you can use an action to expend
            1 or more of its charges to cast the fireball spell (save DC 15) from it.
            For 1 charge, you cast the 3rd-level version of the spell. You can
            increase the spell slot level by one for each additional charge you
            expend.


            The wand regains 1d6 + 1 expended charges daily at dawn. If you expend the wand's last charge, roll a d20. On a 1, the wand crumbles into ashes and is destroyed.


            Use `-amt` and `-l` to set the number of charges spent and the resulting spell level.
          title: ""
        - type: spell
          id: 2102
          dc: "15"
        - type: condition
          condition: lastCounterRemaining == 0
          onTrue:
            - type: roll
              dice: 1d20
              name: destruction
            - type: condition
              condition: lastRoll == 1
              onTrue:
                - type: text
                  text: The wand crumbles into ashes and is destroyed.
                  title: Destruction!
              onFalse: []
          onFalse: []
      _v: 2
      proper: false
      verb: uses
      activation_type: 1
