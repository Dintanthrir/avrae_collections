# basic_rules_2014_staves = "5a3b3deb-0345-45ec-bb0a-6f2caa05fac7"
Staff of Charming:
  counters:
    - name: Staff of Charming
      min: 0
      max: 10
      reset: long
      reset_by: 1d8+2
    - name: Staff of Charming - Resist Enchantment
      desc: Save against an enchantment.
      min: 0
      max: 1
      reset: long
      reset_to: 1
      type: circle
  automations:
    - |
      name: Staff of Charming (Charm Person)
      automation:
        - type: counter
          counter: Staff of Charming
          amount: "1"
          fixedValue: true
          errorBehaviour: raise
        - type: text
          text: >-
            While holding this staff, you can use an action to expend 1 of its 10
            charges to cast charm person, command, or comprehend languages from it
            using your spell save DC. The staff can also be used as a magic
            quarterstaff.


            If you are holding the staff and fail a saving throw against an enchantment spell that targets only you, you can turn your failed save into a successful one. You can't use this property of the staff again until the next dawn. If you succeed on a save against an enchantment spell that targets only you, with or without the staff's intervention, you can use your reaction to expend 1 charge from the staff and turn the spell back on its caster as if you had cast the spell.


            The staff regains 1d8 + 2 expended charges daily at dawn. If you expend the last charge, roll a d20. On a 1, the staff becomes a nonmagical quarterstaff.
        - type: spell
          id: 2025
        - type: condition
          condition: lastCounterRemaining == 0
          onTrue:
            - type: roll
              dice: 1d20
              name: destruction
            - type: condition
              condition: lastRoll == 1
              onTrue:
                - type: text
                  text: The staff becomes a nonmagical quarterstaff.
                  title: Destruction!
              onFalse: []
          onFalse: []
      _v: 2
      proper: false
      verb: casts from
      activation_type: 1
    - |
      name: Staff of Charming (Command)
      automation:
