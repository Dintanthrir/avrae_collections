Heward's Handy Spice Pouch:
  counters:
    - name: Heward's Handy Spice Pouch
      min: 0
      max: 10
      reset: long
      reset_by: 1d6+4
  automations:
    - |
      name: Heward's Handy Spice Pouch
      automation:
        - type: counter
          counter: Heward's Handy Spice Pouch
          amount: "1"
          fixedValue: true
          errorBehaviour: raise
        - type: text
          text: >-
            This belt pouch appears empty and has 10 charges. While holding the pouch, you can use an action to expend 1 of its charges, speak the name of any nonmagical food seasoning (such as salt, pepper, saffron, or cilantro), and remove a pinch of the desired seasoning from the pouch. A pinch is enough to season a single meal. The pouch regains 1d6 + 4 expended charges daily at dawn.
      _v: 2
      proper: false
      verb: opens
      activation_type: 1
Horn of Silent Alarm:
  counters:
    - name: Horn of Silent Alarm
      min: 0
      max: 4
      reset: long
      reset_by: 1d4
      type: bubble
  automations:
    - |
      name: Horn of Silent Alarm
      automation:
        - type: counter
          counter: Horn of Silent Alarm
          amount: "1"
          fixedValue: true
          errorBehaviour: raise
        - type: text
          text: >-
            This horn has 4 charges. When you use an action to blow it, one creature of your choice can hear the horn’s blare, provided the creature is within 600 feet of the horn and not deafened. No other creature hears sound coming from the horn. The horn regains 1d4 expended charges daily at dawn.
      _v: 2
      proper: false
      verb: plays
      activation_type: 1
Instrument of Scribing:
  counters:
    - name: Instrument of Scribing
      min: 0
      max: 3
      reset: long
      type: bubble
  automations:
    - |
      name: Instrument of Scribing
      automation:
        - type: counter
          counter: Instrument of Scribing
          amount: "1"
          fixedValue: true
          errorBehaviour: raise
        - type: text
          text: >-
            This musical instrument has 3 charges. While you are playing it, you can
            use an action to expend 1 charge from the instrument and write a magical
            message on a nonmagical object or surface that you can see within 30 feet
            of you. The message can be up to six words long and is written in a
            language you know. If you are a bard, you can scribe an additional seven
            words and choose to make the message glow faintly, allowing it to be seen
            in nonmagical darkness. Casting dispel magic on the message erases it.
            Otherwise, the message fades away after 24 hours.


            The instrument regains all expended charges daily at dawn.
      _v: 2
      proper: false
      verb: plays
      activation_type: 1
Staff of Birdcalls:
  counters:
    - name: Staff of Birdcalls
      min: 0
      max: 10
      reset: long
      reset_by: 1d6+4
      type: bubble
  automations:
    - |
      name: Staff of Birdcalls
      automation:
        - type: counter
          counter: Staff of Birdcalls
          amount: "1"
          fixedValue: true
          errorBehaviour: raise
        - type: text
          text: >-
            This wooden staff is decorated with bird carvings. It has 10 charges. While holding it, you can use an action to expend 1 charge from the staff and cause it to create one of the following sounds out to a range of 60 feet: a finch’s chirp, a raven’s caw, a duck’s quack, a chicken’s cluck, a goose’s honk, a loon’s call, a turkey’s gobble, a seagull’s cry, an owl’s hoot, or an eagle’s shriek.

            The staff regains 1d6 + 4 expended charges daily at dawn. If you expend the last charge, roll a d20. On a 1, the staff explodes in a harmless cloud of bird feathers and is lost forever.
        - type: condition
          condition: lastCounterRemaining == 0
          onTrue:
            - type: roll
              dice: 1d20
              name: destroy
              fixedValue: true
            - type: condition
              condition: lastRoll == 1
              onTrue:
                - type: text
                  text: The staff explodes in a harmless cloud of bird feathers and is lost forever.
                  title: Destroyed!
              onFalse: []
          onFalse: []
      _v: 2
      proper: false
      verb: uses
      activation_type: 1
