Cloak of Billowing:
  automations:
    - |
      name: Cloak of Billowing
      automation:
        - type: text
          text: While wearing this cloak, you can take a Bonus Action to make it billow
            dramatically for 1 minute.
        - type: target
          target: self
          effects:
            - type: ieffect2
              name: Dramatic
              duration: "10"
      _v: 2
      proper: false
      verb: wears
      activation_type: 3
Dark Shard Amulet:
  counters:
    - name: Dark Shard Amulet
      desc: Attempt to cast a cantrip.
      min: 0
      max: 1
      reset: long
      type: bubble
  automations:
    - |
      name: Dark Shard Amulet
      automation:
        - type: counter
          counter: Dark Shard Amulet
          amount: "1"
          fixedValue: true
          errorBehaviour: raise
        - type: text
          text: You can try to cast a cantrip that you don’t know. The cantrip must be on the warlock spell list, and you must make a DC 10 Intelligence (Arcana) check. If the check succeeds, you cast the spell. If the check fails, so does the spell, and the action used to cast the spell is wasted. In either case, you can’t use this property again until you finish a long rest.
        - type: target
          target: self
          effects:
            - type: check
              ability: arcana
              dc: "10"
              success: []
              fail: []
      _v: 2
      proper: false
      verb: uses
      activation_type: 1
Hat of Vermin:
  counters:
    - name: Hat of Vermin
      desc: Summon vermin.
      min: 0
      max: 3
      reset: long
      type: bubble
  automations:
    - |
      name: Hat of Vermin
      automation:
        - type: counter
          counter: Hat of Vermin
          amount: "1"
          fixedValue: true
          errorBehaviour: raise
        - type: text
          text: >-
            This hat has 3 charges. While holding the hat, you can take a Magic action to expend 1 charge and summon your choice of a Bat, a Frog, or a Rat. The summoned creature magically appears in the hat and tries to get away from you as quickly as possible. The creature is Indifferent toward you and other creatures, and it isn’t under your control. It behaves as an ordinary creature of its kind and disappears after 1 hour or when it drops to 0 Hit Points. The hat regains all expended charges daily at dawn.
      _v: 2
      proper: false
      verb: dons
      activation_type: 1
