          onTrue:
            - type: roll
              dice: 1d20
              name: destroy
              fixedValue: true
            - type: condition
              condition: lastRoll == 1
              onTrue:
                - type: text
                  text: The staff explodes in a harmless cloud of bird feathers and is lost forever.
                  title: Destroyed!
              onFalse: []
          onFalse: []
