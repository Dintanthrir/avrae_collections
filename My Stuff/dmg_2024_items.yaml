Driftglobe:
  counters:
    - name: Driftglobe
      desc: Summon daylight.
      min: 0
      max: 1
      reset: long
      reset_to: 1
      type: circle
  automations:
    - |
      - name: Driftglobe
        automation:
          - type: counter
            counter: Driftglobe
            amount: "1"
            errorBehaviour: raise
          - type: text
            text: >-
              This small sphere of thick glass weighs 1 pound. If you are within 60 feet of it, you can command it to emanate light equivalent to that of the Light or Daylight spell (your choice). Once used, the Daylight effect can’t be used again until the next dawn.

              You can issue another command as a Magic action to make the illuminated globe rise into the air and float no more than 5 feet off the ground. The globe hovers in this way until you or another creature grasps it. If you move more than 60 feet from the hovering globe, it follows you until it is within 60 feet of you. It takes the shortest route to do so. If prevented from moving, the globe sinks gently to the ground and becomes inactive, and its light winks out.
          - type: spell
            id: 2619083
        _v: 2
        proper: false
        verb: activates
        activation_type: 2
Dust of Disappearance:
  automations:
    - |
      - name: Dust of Disappearance
        automation:
          - type: target
            target: all
            effects:
              - type: roll
                dice: 2d4
                name: duration
              - type: ieffect2
                name: Invisible
                duration: duration * 10
                buttons:
                  - label: End Invisibility
                    automation:
                      - type: remove_ieffect
                    style: "1"
              - type: text
                text: This powder resembles fine sand. There is enough of it for one use. When you take a Utilize action to throw the dust into the air, you and each creature and object within a 10-foot Emanation originating from you have the Invisible condition for 2d4 minutes. The duration is the same for all subjects, and the dust is consumed when its magic takes effect. Immediately after an affected creature makes an attack roll, deals damage, or casts a spell, the Invisible condition ends for that creature.
        _v: 2
        proper: true
        verb: scatters
        activation_type: 1
Dust of Sneezing and Choking:
  automations:
    - |
