Cube of Summoning:
  counters:
    - name: Cube of Summoning
      desc: Summon a creature.
      min: 0
      max: 1
      reset: long
      type: bubble
  automations:
    - |
      name: Cube of Summoning
      automation:
        - type: counter
          counter: Cube of Summoning
          amount: "1"
          fixedValue: true
          errorBehaviour: raise
        - type: text
          text: >-
            This Tiny cube looks like a jack-in-the-box. When you wind its crank as a
            Magic action, a merry tune emits from the box, the lid pops open, a
            creature appears in the nearest unoccupied space, and the lid closes. The
            lid can’t otherwise be opened.


            Roll on the Cube of Summoning table to determine which spell the cube casts to summon the creature. The spell is cast at level 5 (save DC 17, +9 attack bonus) and doesn’t require Concentration, but you otherwise function as the spell’s caster.


            Once the cube summons a creature, the cube can’t do so again until the next dawn.
        - type: roll
          dice: 1d6
          name: summon
          displayName: Summoned Creature
        - type: text
          text: |-
            1d6 	Spell
            1 	Summon Aberration
            2 	Summon Beast
            3 	Summon Construct
            4 	Summon Dragon
            5 	Summon Elemental
            6 	Summon Fey
          title: Cube of Summoning
      _v: 2
      proper: false
      verb: activates
      activation_type: 1
    - |
      name: Cube of Summoning (Aberration)
      automation:
        - type: spell
          id: 2619105
          dc: "17"
          attackBonus: "9"
