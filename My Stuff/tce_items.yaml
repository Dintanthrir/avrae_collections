Coiling Grasp Tattoo:
  automations:
    - |
      name: Grasping Tendrils
      automation:
        - type: text
          text: While the tattoo is on your skin, you can, as an action, cause the tattoo
            to extrude into inky tendrils, which reach for a creature you can see
            within 15 feet of you. The creature must succeed on a DC 14 Strength
            saving throw or take 3d6 force damage and be grappled by you. As an
            action, the creature can escape the grapple by succeeding on a DC 14
            Strength (Athletics) or Dexterity (Acrobatics) check. The grapple also
            ends if you halt it (no action required), if the creature is ever more
            than 15 feet away from you, or if you use this tattoo on a different
            creature.
        - type: target
          target: all
          effects:
            - type: save
              stat: str
              fail:
                - type: damage
                  damage: 3d6[force]
                - type: ieffect2
                  name: Grappled
                  buttons:
                    - label: Escape Grapple
                      automation:
                        - type: target
                          target: self
                          effects:
                            - type: check
                              ability:
                                - athletics
                                - acrobatics
                              dc: "14"
                              success:
                                - type: remove_ieffect
                              fail: []
                      verb: attempts to escape grasping tendrils
                      style: "1"
                      defaultDC: lastSaveDC
              success: []
              dc: "14"
      _v: 2
      proper: true
      activation_type: 1
