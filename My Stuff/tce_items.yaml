All-Purpose Tool:
  counters:
    - name: All-Purpose Tool
      desc: Temporarily learn a cantrip.
      reset: long
      min: 0
      max: 1
      type: bubble
  automations:
    - |
      name: All-Purpose Tool
      automation:
        - type: counter
          counter: All-Purpose Tool
          amount: "1"
          fixedValue: true
          errorBehaviour: raise
        - type: text
          text: As an action, you can focus on the tool to channel your creative forces.
            Choose a cantrip that you don't know from any class list. For 8 hours, you
            can cast that cantrip, and it counts as an artificer cantrip for you. Once
            this property is used, it can't be used again until the next dawn.
      _v: 2
      proper: true
      verb: focuses on their
      activation_type: 1
Astromancy Archive:
  counters:
    - name: Astromancy Archive
      reset: long
      min: 0
      max: 3
      reset_by: 1d3
      type: bubble
  automations:
    - |
      name: Astromancy Archive (Study)
      automation:
        - type: counter
          counter: Astromancy Archive
          amount: "1"
          fixedValue: true
          errorBehaviour: raise
        - type: text
          text: >-
            The archive has 3 charges, and it regains 1d3 expended charges daily at
            dawn. You can use the charges in the following ways while holding it:

                If you spend 1 minute studying the archive, you can expend 1 charge to replace one of your prepared wizard spells with a different spell in the archive. The new spell must be of the divination school.
      _v: 2
      proper: true
      verb: studies their
      activation_type: 6
    - |
      name: Astromancy Archive (Use)
      automation:
        - type: counter
          counter: Astromancy Archive
          amount: "1"
          fixedValue: true
          errorBehaviour: raise
        - type: text
          text: >-
            The archive has 3 charges, and it regains 1d3 expended charges daily at
            dawn. You can use the charges in the following ways while holding it:

                When a creature you can see within 30 feet of you makes an attack roll, an ability check, or a saving throw, you can use your reaction to expend 1 charge and force the creature to roll a d4 and apply the number rolled as a bonus or penalty (your choice) to the original roll. You can do this after you see the roll but before its effects are applied.
      _v: 2
      proper: true
      verb: uses their
      activation_type: 4
