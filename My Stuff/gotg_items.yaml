Thunderbuss:
  counters:
    - name: Thunderbuss
      desc: Invoke the storm rune.
      min: 0
      max: 1
      reset: long
      type: bubble
  automations:
    - |
      name: Thunderbuss (Storm Rune)
      automation:
        - type: counter
          counter: Thunderbuss
          amount: "1"
          errorBehaviour: raise
        - type: text
          text: >-
            As a bonus action, you can invoke the weapon’s rune to launch a ball of
            energy to a point you can see within 30 feet of yourself. The energy then
            detonates into a 10-foot-radius sphere of turbulent wind and thunder
            centered on that point, and each creature in that sphere must make a DC 14
            Constitution saving throw. On a failed save, a creature takes 3d6 thunder
            damage, and it can’t take reactions until the end of your next turn. On a
            successful save, a creature takes half as much damage only.


            Once the rune has been invoked, it can’t be invoked again until the next dawn.
          title: Invoking the Rune
        - type: roll
          dice: 3d6[thunder]
          name: damage
        - type: target
          target: all
          effects:
            - type: save
              stat: con
              fail:
                - type: damage
                  damage: "{damage}"
                - type: ieffect2
                  name: Cannot take reactions
                  duration: "2"
                  tick_on_caster: true
                  end: true
              success:
                - type: damage
                  damage: ({damage})/2
              dc: "14"
      _v: 2
      proper: true
      verb: invokes the rune on their
      activation_type: 3
