Bloodshed Blade:
  counters:
    - name: Bloodshed Blade
      desc: Spend hit dice to empower an attack.
      min: 0
      max: 1
      reset: long
      type: bubble
  automations:
    - |
      name: Bloodshed Blade (Blood Rune)
      automation:
        - type: counter
          counter: Bloodshed Blade
          amount: "1"
          fixedValue: true
          errorBehaviour: raise
        - type: text
          text: >-
            When you target a creature with an attack using this weapon, you can
            invoke the sword’s rune, causing it to flare with crimson light and
            infusing your attack with bloodthirsty precision. You then spend and roll
            one of your unspent Hit Dice and add the number rolled to the attack roll.
            You can choose to invoke the rune after rolling the d20.


            If this attack hits, you can also spend and roll any number of your unspent Hit Dice and add the total rolled to the weapon’s damage.


            Once the rune has been invoked, it can’t be invoked again until the next dawn.
          title: Invoking the Rune
      _v: 2
      proper: true
      verb: invokes the rune on their
      activation_type: 2
