Gray Bag of Tricks:
  counters:
    - name: Gray Bag of Tricks
      desc: Pull a creature from the bag.
      min: 0
      max: 3
      reset: long
      reset_to: 3
      type: circle
  automations:
    - |
      - name: Gray Bag of Tricks
        automation:
          - type: counter
            counter: Gray Bag of Tricks
            amount: "1"
            errorBehaviour: raise
          - type: roll
            dice: 1d8
            name: creature
            displayName: Creature
          - type: condition
            condition: creature == 1
            onTrue:
              - type: text
                text: ""
                title: Weasel
            onFalse: []
          - type: condition
            condition: creature == 2
            onTrue:
              - type: text
                text: ""
                title: Giant Rat
            onFalse: []
          - type: condition
            condition: creature == 3
            onTrue:
              - type: text
                text: ""
                title: Badger
            onFalse: []
          - type: condition
            condition: creature == 4
            onTrue:
              - type: text
                text: ""
                title: Boar
            onFalse: []
          - type: condition
            condition: creature == 5
            onTrue:
              - type: text
                text: ""
                title: Panther
            onFalse: []
          - type: condition
            condition: creature == 6
            onTrue:
              - type: text
                text: ""
                title: Giant Badger
            onFalse: []
          - type: condition
            condition: creature == 7
            onTrue:
              - type: text
                text: ""
                title: Dire Wolf
            onFalse: []
          - type: condition
            condition: creature == 8
            onTrue:
              - type: text
                text: ""
                title: Giant Elk
            onFalse: []
          - type: text
            text: >-
              This bag made from gray, rust, or tan cloth appears empty. Reaching inside the bag, however, reveals the presence of a small, fuzzy object.

              You can take a Magic action to pull the fuzzy object from the bag and throw it up to 20 feet. When the object lands, it transforms into a creature you determine by rolling on the table that corresponds to the bag’s color. See the Monster Manual for the creature’s stat block. The creature vanishes at the next dawn or when it is reduced to 0 Hit Points.

              The creature is Friendly to you and your allies, and it acts immediately after you on your Initiative count. You can take a Bonus Action to command how the creature moves and what action it takes on its next turn, such as attacking an enemy. In the absence of such orders, the creature acts in a fashion appropriate to its nature.

              Once three fuzzy objects have been pulled from the bag, the bag can’t be used again until the next dawn.
        _v: 2
        proper: false
        verb: pulls from
        activation_type: 1
