  counters:
    - name: Boots of Speed
      desc: Click your heels together.
      min: 0
      max: 100
      reset: long
      reset_to: 100
  automations:
    - |
      - name: Boots of Speed
        automation:
          - type: counter
            counter: Boots of Speed
            amount: "1"
          - type: text
            text: >-
              While you wear these boots, you can take a Bonus Action to click the
              boots’ heels together. If you do, the boots double your Speed, and any
              creature that makes an Opportunity Attack against you has Disadvantage
              on the attack roll. If you click your heels together again, you end the
              effect.


              When you’ve used the boots’ property for a total of 10 minutes, the magic ceases to function for you until you finish a Long Rest.


              Use `-amt` to specify a number of rounds of use.
        _v: 2
        proper: true
        verb: clicks the heels of their
        activation_type: 3
Bowl of Commanding Water Elementals:
  counters:
    - name: Bowl of Commanding Water Elementals
      desc: Conjure an elemental.
      min: 0
      max: 1
      reset: long
      reset_to: 1
      type: circle
  automations:
    - |
      - name: Bowl of Commanding Water Elementals
        automation:
          - type: counter
            counter: Bowl of Commanding Water Elementals
            amount: "1"
            errorBehaviour: raise
          - type: text
            text: >-
              While this bowl is filled with water and you are within 5 feet of it, you can take a Magic action to summon a Water Elemental. The elemental appears in an unoccupied space as close to the bowl as possible, understands your languages, obeys your commands, and takes its turn immediately after you on your Initiative count. The elemental disappears after 1 hour, when it dies, or when you dismiss it as a Bonus Action. The bowl can’t be used this way again until the next dawn.

              The bowl is about 1 foot in diameter and half as deep. It holds about 3 gallons.
        _v: 2
        proper: false
        verb: activates
        activation_type: 1
