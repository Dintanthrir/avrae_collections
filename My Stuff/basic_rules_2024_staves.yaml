    - name: Staff of Thunder and Lightning (Lightning Strike)
      min: 0
      max: 1
      reset: long
      reset_to: 1
      type: circle
    - name: Staff of Thunder and Lightning (Thunderclap)
      min: 0
      max: 1
      reset: long
      reset_to: 1
      type: circle
    - name: Staff of Thunder and Lightning (Thunder and Lightning)
      min: 0
      max: 1
      reset: long
      reset_to: 1
      type: circle
  automations:
    - |
      name: Staff of Thunder and Lightning (Lightning)
      automation:
        - type: counter
          counter: Staff of Thunder and Lightning (Lightning)
          amount: "1"
          fixedValue: true
          errorBehaviour: raise
        - type: text
          text: When you hit with a melee attack using the staff, you can cause the target
            to take an extra 2d6 lightning damage (no action required).
          title: Lightning
        - type: target
          target: all
          effects:
            - type: damage
              damage: 2d6[lightning]
      _v: 2
      proper: false
      verb: uses
      activation_type: 2
    - |
      name: Staff of Thunder and Lightning (Thunder)
      automation:
        - type: counter
          counter: Staff of Thunder and Lightning (Thunder)
          amount: "1"
          fixedValue: true
          errorBehaviour: raise
        - type: text
          text: When you hit with a melee attack using the staff, you can cause the staff to emit a crack of thunder, audible out to 300 feet (no action required). The target you hit must succeed on a DC 17 Constitution saving throw or have the Stunned condition until the end of your next turn.
          title: Thunder
        - type: target
          target: all
          effects:
            - type: save
              stat: con
              fail:
                - type: ieffect2
                  name: Stunned
                  tick_on_caster: true
                  duration: "2"
              success: []
              dc: "17"
      _v: 2
      proper: false
      verb: uses
      activation_type: 2
    - |
      name: Staff of Thunder and Lightning (Lightning Strike)
      automation:
        - type: counter
          counter: Staff of Thunder and Lightning (Lightning Strike)
          amount: "1"
          fixedValue: true
          errorBehaviour: raise
        - type: text
          text: You can take a Magic action to cause a bolt of lightning to leap from the staff’s tip in a Line that is 5 feet wide and 120 feet long. Each creature in that Line makes a DC 17 Dexterity saving throw, taking 9d6 Lightning damage on a failed save or half as much damage on a successful one.
          title: Lightning Strike
        - type: roll
          dice: 9d6[lightning]
          name: damage
        - type: target
          target: all
          effects:
            - type: save
              stat: dex
              fail:
                - type: damage
                  damage: "{damage}"
              success:
                - type: damage
                  damage: ({damage})/2
              dc: "17"
      _v: 2
      proper: false
      verb: uses
      activation_type: 1
    - |
      name: Staff of Thunder and Lightning (Thunderclap)
      automation:
        - type: counter
          counter: Staff of Thunder and Lightning (Thunderclap)
          amount: "1"
          fixedValue: true
          errorBehaviour: raise
        - type: text
          text: You can take a Magic action to cause the staff to produce a thunderclap audible out to 600 feet. Every creature within a 60-foot Emanation originating from you makes a DC 17 Constitution saving throw. On a failed save, a creature takes 2d6 Thunder damage and has the Deafened condition for 1 minute. On a successful save, a creature takes half as much damage only.
          title: Thunderclap
        - type: roll
          dice: 2d6[thunder]
          name: damage
        - type: target
          target: all
          effects:
            - type: save
              stat: con
              fail:
                - type: damage
                  damage: "{damage}"
                - type: ieffect2
                  name: Deafened
                  duration: "10"
              success:
                - type: damage
                  damage: ({damage})/2
              dc: "17"
      _v: 2
      proper: false
      verb: uses
      activation_type: 1
    - |
