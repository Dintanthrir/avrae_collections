Wand of Binding:
  counters:
    - name: Wand of Binding
      min: 0
      max: 7
      reset: long
      reset_by: 1d6+1
  automations:
    - |
      name: Wand of Binding (Hold Monster)
      automation:
        - type: counter
          counter: Wand of Binding
          amount: "5"
          fixedValue: true
          errorBehaviour: raise
        - type: spell
          id: 2619152
          dc: "17"
        - type: condition
          condition: lastCounterRemaining == 0
          onTrue:
            - type: roll
              dice: 1d20
              name: destruction
              fixedValue: true
            - type: condition
              condition: lastRoll == 1
              onTrue:
                - type: text
                  text: The wand crumbles into ashes and is destroyed.
                  title: Destruction!
              onFalse: []
          onFalse: []
      _v: 2
      proper: false
      activation_type: 1
    - |
      name: Wand of Binding (Hold Person)
      automation:
        - type: counter
          counter: Wand of Binding
          amount: "2"
          fixedValue: true
          errorBehaviour: raise
        - type: spell
