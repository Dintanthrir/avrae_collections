Wand of Paralysis:
  counters:
    - name: Wand of Paralysis
      min: 0
      max: 7
      reset: long
      reset_by: 1d6+1
  automations:
    - |
      name: Wand of Paralysis
      automation:
        - type: counter
          counter: Wand of Paralysis
          amount: "1"
          fixedValue: true
          errorBehaviour: raise
        - type: target
            target: all
            effects:
              - type: save
                stat: con
                fail:
                  - type: ieffect2
                    name: Paralyzed
                    buttons:
                      - label: Resist Paralysis
                        automation:
                          - type: target
                            target: self
                            effects:
                              - type: save
                                stat: dex
                                success:
                                  - type: remove_ieffect
                                    removeParent: if_no_children
                                fail: []
                        verb: attempts to resist Paralysis
                        style: "1"
                        defaultDC: lastSaveDC
                    duration: "10"
                success: []
                dc: "15"
        - type: text
          text: >-
            This wand has 7 charges. While holding it, you can take a Magic action to expend 1 charge to cause a thin blue ray to streak from the tip toward a creature you can see within 60 feet of yourself. The target must succeed on a DC 15 Constitution saving throw or have the Paralyzed condition for 1 minute. At the end of each of the target’s turns, it repeats the save, ending the effect on itself on a success.
        - type: condition
          condition: lastCounterRemaining == 0
          onTrue:
            - type: roll
              dice: 1d20
              name: destruction
              fixedValue: true
            - type: condition
              condition: lastRoll == 1
              onTrue:
                - type: text
                  text: The wand crumbles into ashes and is destroyed.
                  title: Destruction!
              onFalse: []
          onFalse: []
      _v: 2
      proper: false
      activation_type: 1
