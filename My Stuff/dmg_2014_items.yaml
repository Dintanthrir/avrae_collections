Mace of Disruption:
  automations:
    - |
      - name: Mace of Disruption (Disrupting Strike)
        automation:
          - type: target
            target: all
            effects:
              - type: attack
                hit:
                  - type: damage
                    damage: 1d6[magical bludgeoning]
                  - type: condition
                    condition: target.creature_type and ("fiend" in target.creature_type or "undead"
                      in target.creature_type)
                    onTrue:
                      - type: damage
                        damage: 2d6[radiant]
                      - type: condition
                        condition: target.hp <= 25
                        onTrue:
                          - type: save
                            stat: wis
                            fail:
                              - type: text
                                text: ""
                                title: Destroyed!
                              - type: damage
                                damage: target.hp + target.temp_hp
                                fixedValue: true
                            success:
                              - type: ieffect2
                                name: Frightened
                                duration: "1"
                                tick_on_caster: true
                                end: true
                            dc: "15"
                        onFalse: []
                    onFalse: []
                miss: []
                attackBonus: caster.stats.get_mod("strength") + caster.stats.prof_bonus
          - type: text
            text: >-
              When you hit a Fiend or an Undead with this magic weapon, that creature
              takes an extra 2d6 Radiant damage. If the target has 25 Hit Points or
              fewer after taking this damage, it must succeed on a DC 15 Wisdom saving
              throw or be destroyed. On a successful save, the creature has the
              Frightened condition until the end of your next turn.


              Light. While you hold this weapon, it sheds Bright Light in a 20-foot radius and Dim Light for an additional 20 feet.
        _v: 2
        proper: false
        activation_type: 2
Mace of Smiting:
  automations:
    - |
      - name: Mace of Smiting (Smiting Strike)
        automation:
