                condition: target.creature_type and "construct" in target.creature_type
                onTrue:
                  - type: attack
                    hit:
                      - type: damage
                        damage: 1d6 + {caster.stats.get_mod("strength")} + 3[magical bludgeoning]
                      - type: condition
                        condition: lastAttackNaturalRoll == 20
                        onTrue:
                          - type: damage
                            damage: 14[magical bludgeoning]
                          - type: condition
                            condition: target.hp <= 25
                            onTrue:
                              - type: damage
                                damage: "{target.hp + target.temp_hp}"
                            onFalse: []
                        onFalse: []
                    miss: []
                    attackBonus: caster.stats.get_mod("strength") + caster.stats.prof_bonus + 3
                onFalse:
                  - type: attack
                    hit:
                      - type: damage
                        damage: 1d6 + {caster.stats.get_mod("strength")} + 1[magical bludgeoning]
                      - type: condition
                        condition: lastAttackNaturalRoll == 20
                        onTrue:
                          - type: damage
                            damage: 7[magical bludgeoning]
                        onFalse: []
                    miss: []
                    attackBonus: caster.stats.get_mod("strength") + caster.stats.prof_bonus + 1
                errorBehaviour: "false"
