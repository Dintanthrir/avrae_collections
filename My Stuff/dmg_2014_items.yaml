Staff of Striking:
  counters:
    - name: Staff of Striking
      min: 0
      max: 10
      reset: long
      reset_by: 1d6+4
  automations:
    - |
      name: Staff of Striking (Force Strike)
      automation:
        - type: counter
          counter: Staff of Striking
          amount: "0"
          errorBehaviour: raise
        - type: text
          text: >-
            The staff has 10 charges. When you hit with a melee attack using it, you
            can expend up to 3 charges. For each charge you expend, the target takes
            an extra 1d6 Force damage.


            Regaining Charges. The staff regains 1d6 + 4 expended charges daily at dawn. If you expend the last charge, roll 1d20. On a 1, the staff becomes a nonmagical Quarterstaff.


            Use `-amt` to choose how many charges to spend.
        - type: target
          target: all
          effects:
            - type: damage
              damage: "{lastCounterUsedAmount}d6[force]"
        - type: condition
          condition: lastCounterRemaining == 0
          onTrue:
            - type: roll
              dice: 1d20
              name: destruction
            - type: condition
              condition: lastRoll == 1
              onTrue:
                - type: text
                  text: The staff becomes a nonmagical Quarterstaff.
                  title: Destruction!
              onFalse: []
          onFalse: []
      _v: 2
      proper: false
      activation_type: 2
Staff of the Adder:
  automations:
    - |
      name: Staff of the Adder (Animate)
      automation:
        - type: target
          target: self
          effects:
            - type: ieffect2
              name: Staff of the Adder
              duration: "10"
              attacks:
                - attack:
                    _v: 2
                    name: Adder Strike
                    automation:
                      - type: target
                        target: each
                        effects:
                          - type: attack
                            hit:
                              - type: damage
                                damage: 1d6[piercing]
                              - type: save
                                stat: con
                                fail:
                                  - type: damage
                                    damage: 3d6[poison]
                                success: []
                                dc: "15"
                            miss: []
                            attackBonus: caster.stats.get_mod("strength") + caster.stats.prof_bonus
        - type: text
          text: >-
            You can use a bonus action to speak the staff's command word and make the
            head of the staff become that of an animate poisonous snake for 1 minute.
            By using another bonus action to speak the command word again, you return
            the staff to its normal inanimate form.


            You can make a melee attack using the snake head, which has a reach of 5 feet. Your proficiency bonus applies to the attack roll. On a hit, the target takes 1d6 piercing damage and must succeed on a DC 15 Constitution saving throw or take 3d6 poison damage.


            The snake head can be attacked while it is animate. It has an Armor Class of 15 and 20 hit points. If the head drops to 0 hit points, the staff is destroyed. As long as it's not destroyed, the staff regains all lost hit points when it reverts to its animate form.

            Add the snake head to combat: `!i add 0 "Adder Head" -p 0 -hp 20 -ac 15`
      _v: 2
      proper: false
      verb: animates
      activation_type: 3
